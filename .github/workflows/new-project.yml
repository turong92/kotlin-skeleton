name: new-project
# scripts/new-project.sh 로 세 조합을 찍어 각각 ./gradlew build (Docker/Testcontainers 필요 — ubuntu-latest 에 있다). 순차로 돈다.
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'modules/*/build.gradle.kts', 'apps/**', 'settings.gradle.kts', 'build.gradle.kts', 'docs/config/modules/**', 'docker-compose.yml', '.github/workflows/new-project.yml']
  pull_request:
    paths: ['scripts/**', 'modules/*/build.gradle.kts', 'apps/**', 'settings.gradle.kts', 'build.gradle.kts', 'docs/config/modules/**', 'docker-compose.yml', '.github/workflows/new-project.yml']

jobs:
  stamp-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash scripts/test-new-project.sh --full
