name: deploy-cloudrun
# Cloud Run 배포 (deploy/cloudrun/README.md) — `v*` 태그를 밀거나 손으로(태그 입력) 돌린다.
# 선언(deploy/app.yaml)의 cloudrun: 칸을 deploy/cloudrun/render.sh 가 플래그 · 환경 파일로 바꾼다.
# 인증은 WIF 뿐이다(키 파일 · GitHub 비밀 없음). 값은 terraform 출력(github_variables)을 이 레포의 변수로 옮겨 둔 것이다.
# 템플릿 레포나 변수(GCP_PROJECT_ID)가 없는 레포에서는 돌지 않는다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '배포할 태그 (예: v1.2.3)'
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.repository.is_template != true && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUDRUN_SERVICE }}
      IMAGE_REPO: ${{ vars.CLOUDRUN_IMAGE_REPO }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      PLATFORM_ENV_JSON: ${{ vars.CLOUDRUN_PLATFORM_ENV }}
      PLATFORM_SECRETS_JSON: ${{ vars.CLOUDRUN_PLATFORM_SECRETS }}
    steps:
      - name: 태그 모양 검사
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "태그 모양이 틀리다 (v1.2.3 또는 v1.2.3-rc.1)" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: 선언을 배포 입력으로
        env:
          IMAGE_TAG: ${{ env.TAG }}
        run: bash deploy/cloudrun/render.sh deploy/app.yaml "$RUNNER_TEMP/render"

      - name: 이미지 저장소 인증
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 · 푸시
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r line; do
            [ -n "$line" ] && args+=(--build-arg "${line#--build-arg }")
          done < "$RUNNER_TEMP/render/build-args.txt"
          docker buildx build --platform linux/amd64 \
            -f "$(cat "$RUNNER_TEMP/render/dockerfile")" \
            "${args[@]}" \
            -t "$(cat "$RUNNER_TEMP/render/image")" \
            --metadata-file "$RUNNER_TEMP/build-meta.json" \
            --push .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build-meta.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "다이제스트를 읽지 못했다" >&2; exit 1; }
          echo "DIGEST=$digest" >> "$GITHUB_ENV"

      - name: 후보 리비전 배포
        run: |
          set -euo pipefail
          mapfile -t flags < "$RUNNER_TEMP/render/deploy-flags.txt"
          extra=()
          # 서비스가 없을 때만 첫 배포다 — 조회가 다른 이유로 실패하면 여기서 잡이 멈춘다(시험 안 한 리비전이 100% 로 가지 않게)
          found="$(gcloud run services list --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --filter="metadata.name=$SERVICE" --format='value(metadata.name)')"
          if [ -n "$found" ]; then
            extra=(--no-traffic --tag candidate)
            echo "FIRST_DEPLOY=false" >> "$GITHUB_ENV"
          else
            # 첫 배포는 새 서비스라 --no-traffic 을 쓸 수 없다 — 바로 100% 로 간다
            echo "FIRST_DEPLOY=true" >> "$GITHUB_ENV"
          fi
          gcloud run deploy "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --image "${IMAGE_REPO}@${DIGEST}" \
            --env-vars-file "$RUNNER_TEMP/render/env.yaml" \
            --set-secrets "$(cat "$RUNNER_TEMP/render/secrets.txt")" \
            "${flags[@]}" \
            ${extra[@]+"${extra[@]}"}

      - name: 후보 주소
        run: |
          set -euo pipefail
          json="$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          if [ "$FIRST_DEPLOY" = true ]; then
            url="$(jq -r '.status.url' <<<"$json")"
          else
            url="$(jq -r '.status.traffic[] | select(.tag == "candidate") | .url' <<<"$json")"
          fi
          [[ "$url" =~ ^https:// ]] || { echo "후보 주소를 찾지 못했다" >&2; exit 1; }
          echo "CANDIDATE_URL=$url" >> "$GITHUB_ENV"

      - name: 배포 뒤 확인
        run: |
          set -euo pipefail
          umask 077
          headers="$RUNNER_TEMP/smoke-headers"
          trap 'rm -f "$headers"' EXIT
          # 값을 읽어 이름 $2 변수에 넣는다. 마스크 명령은 러너 stdout 으로 곧장 나가야 하므로 $( ) 안에 두지 않는다
          read_secret() {
            local _v
            _v="$(gcloud secrets versions access latest --secret="$1" --project "$GCP_PROJECT_ID")"
            echo "::add-mask::$_v"
            printf -v "$2" '%s' "$_v"
          }
          read_secret ORIGIN_AUTH_SECRET origin_secret
          printf 'X-Origin-Auth: %s\n' "$origin_secret" > "$headers"

          # 조회는 if 밖에서 한다 — 조건 안에서는 set -e 가 꺼져 조회 실패가 "판 없음"으로 보인다
          email_version="$(gcloud secrets versions list SMOKE_EMAIL --project "$GCP_PROJECT_ID" --filter='state=enabled' --limit=1 --format='value(name)')"
          password_version="$(gcloud secrets versions list SMOKE_PASSWORD --project "$GCP_PROJECT_ID" --filter='state=enabled' --limit=1 --format='value(name)')"

          if [ -n "$email_version" ] && [ -n "$password_version" ]; then
            read_secret SMOKE_EMAIL SMOKE_EMAIL
            read_secret SMOKE_PASSWORD SMOKE_PASSWORD
            export SMOKE_EMAIL SMOKE_PASSWORD
            SMOKE_HEADERS_FILE="$headers" scripts/post-deploy-check.sh "$CANDIDATE_URL" --wait 90
          elif [ "$FIRST_DEPLOY" = true ]; then
            # 시험 계정은 서비스가 처음 뜬 뒤에 가입시킨다 — 첫 배포는 로그인 확인만 건너뛰고 health · 원점 비밀(403)은 본다. /health 는 기동 확인 때문에 비밀 없이 열려 있어 API 경로로 본다
            echo "SMOKE_EMAIL · SMOKE_PASSWORD 판이 아직 없다 — 첫 배포라 로그인 확인은 건너뛴다"
            deadline=$((SECONDS + 90))
            code=000
            while :; do
              code="$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -H @"$headers" "$CANDIDATE_URL/health" || true)"
              [ "$code" = 200 ] && break
              [ "$SECONDS" -lt "$deadline" ] || break
              sleep 1
            done
            [ "$code" = 200 ] || { echo "/health 가 200 이 아니다 (마지막 상태 $code)" >&2; exit 1; }
            code="$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$CANDIDATE_URL/api/v1/auth/me" || true)"
            [ "$code" = 403 ] || { echo "원점 비밀 없이 부른 /api/v1/auth/me 가 403 이 아니다 (상태 $code)" >&2; exit 1; }
            echo "health 200 · 원점 비밀 없는 API 호출 403 확인"
          else
            echo "::error::SMOKE_EMAIL · SMOKE_PASSWORD 판이 없다 — 시험 계정을 가입시키고 값을 넣는다"
            exit 1
          fi

      - name: 트래픽 전환
        if: env.FIRST_DEPLOY != 'true'
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --to-tags candidate=100
