name: CI
on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새로 올라오면 돌던 검사는 멈춘다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# push · PR 은 빠른 검사만: MySQL 두 번째 벌(mysqlTest)과 새 프로젝트 빠른 검사(newProjectChecks, new-project.yml 이 따로 돈다)는 뺀다.
# 전체 build(둘 다 포함)와 조합 전체 빌드는 하루 한 번 nightly.yml 이 돈다.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: perl scripts/build-capabilities.pl --check   # 기능 카탈로그 생성물이 최신인가(빠른 실패) — 전체 가드는 ./gradlew build 의 Capabilities*Test
      - run: perl scripts/migrations-lock.pl --check            # 동결된 마이그레이션이 그대로인가(빠른 실패) — 같은 검사가 ./gradlew build 의 MigrationLockTest 에도 있다
      - run: ./gradlew build -x newProjectChecks -x mysqlTest
