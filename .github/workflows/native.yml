name: native
# 네이티브 이미지 시험 (docs/native-image.md) — 평소 CI(ci.yml)와 따로, 드물게만 돈다:
#   · 릴리스 태그(v*)를 밀 때
#   · 의존성 파일(빌드 파일 · 버전 · lock)이나 네이티브 힌트가 바뀐 PR — 새 라이브러리는 네이티브에서만 깨질 수 있다
#   · 손으로(workflow_dispatch)
# 매 푸시 · 매 PR 에서는 돌지 않는다(빌드가 몇 분 걸린다). GraalVM 25 공식 이미지 안에서 tools/native-check 를 네이티브로 빌드해 가입 · 로그인 · 갱신 · 결제 · 구독 · 작업 · 웹훅을 돌린다.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '**/build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '**/*.lockfile'
      - '**/aot.factories'
      - 'tools/native-check/**'
      - 'scripts/native-*.sh'
      - '.github/workflows/native.yml'
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.gradle-native
          key: native-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: native-gradle-
      # 러너 자원에 맞춘다 — 한도를 넘는 --cpus 는 docker 가 거부한다(메모리는 한도를 두지 않는다: 공개 러너 16GB 에서 빌드 최대 6GB 안팎)
      - run: NATIVE_CPUS="$(nproc)" scripts/native-test.sh
