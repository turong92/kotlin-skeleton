name: image
# 보류(on hold) — 홈서버 앱은 GHCR 를 쓰지 않고 홈서버에서 `docker build -t <app>:<tag> .` 로 로컬 빌드한다 (docs/deploy.md §1 · §6).
# 이 워크플로는 나중에 레지스트리를 쓰게 될 때를 위해 남겨 두고, **수동 실행(workflow_dispatch)으로만** 돈다 — 태그 푸시 · 브랜치 푸시 · PR 은 아무것도 올리지 않는다.
#   · 불변 태그만 만든다: 입력한 v<버전> 과 sha-<커밋>. latest 는 만들지 않는다. 이미 있는 태그는 덮어쓰지 않는다.
#   · 스켈레톤 레포 자체는 템플릿 레포(is_template)라 이 잡이 돌지 않는다.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'immutable image tag, vMAJOR.MINOR.PATCH[-suffix]'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "tag '$TAG' is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1; }
          NAME="$(sed -n 's/^name:[[:space:]]*\([a-z0-9-]*\).*/\1/p' deploy/app.yaml | head -1)"
          [ -n "$NAME" ] || { echo "deploy/app.yaml has no name:"; exit 1; }
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${NAME}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        shell: bash
        run: |
          set -euo pipefail
          for t in "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.sha_tag }}"; do
            if docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:${t}" >/dev/null 2>&1; then
              echo "${{ steps.meta.outputs.image }}:${t} already exists — tags are immutable; cut a new version"; exit 1
            fi
          done

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=api
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
