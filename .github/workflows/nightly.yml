name: nightly
# 하루 한 번(KST 03:00) + 수동. push 때 빼 둔 느린 검사를 돈다:
#  - full-build: ./gradlew build 전체 — mysqlTest(MySQL 두 번째 벌)와 newProjectChecks 포함
#  - compositions: scripts/test-new-project.sh --full — 조합을 찍어 각각 ./gradlew build (Docker/Testcontainers 필요)
# 두 잡은 나란히 돈다. push · PR 의 빠른 검사는 ci.yml · new-project.yml.
on:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = KST 03:00
  workflow_dispatch:

jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  compositions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash scripts/test-new-project.sh --full
