name: nightly
# 하루 한 번(KST 03:00) + 수동. push 때 빼 둔 느린 검사를 돈다:
#  - full-build: ./gradlew build 전체 — mysqlTest(MySQL 두 번째 벌)와 newProjectChecks 포함
#  - jooq-mysql: persistence-jooq 의 코드 생성 + 시험을 MySQL 방언으로 (push 의 build 는 기본 PostgreSQL 방언만 돈다)
#  - compositions: scripts/test-new-project.sh --full — 조합을 찍어 각각 ./gradlew build (Docker/Testcontainers 필요)
# 잡들은 나란히 돈다. push · PR 의 빠른 검사는 ci.yml · new-project.yml.
on:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = KST 03:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -x newProjectChecks -Dskeleton.test.stress=full   # --quick 은 compositions 잡의 test-new-project.sh --full 이 이미 돈다

  jooq-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :modules:persistence-jooq:test -Pskeleton.jooq.dialect=mysql

  compositions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash scripts/test-new-project.sh --full
