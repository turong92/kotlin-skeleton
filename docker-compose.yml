# 컨테이너 · 볼륨 이름의 접두사 — 폴더 이름(api · web 처럼 흔한 이름)에 기대면 다른 프로젝트와 섞인다. new-project.sh 가 새 이름으로 바꾼다
name: kotlin-skeleton
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # 다른 포트로 띄우려면 DB_PORT=15432 (샘플 앱 yml 도 같은 이름을 읽는다)
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "app"]
      interval: 2s
      retries: 30

  # db-mysql 모듈로 조립한 앱용: --profile mysql
  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: dev-root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: dev
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # 아래 세 서비스는 해당 모듈을 얹은 앱용이다. `docker compose up` 만으로는 뜨지 않는다 — 필요한 것만 프로필로 켠다:
  #   docker compose --profile redis up -d        (redis-core · redis-lock · redis-cache · redis-rate-limit)
  #   docker compose --profile kafka --profile mail up -d
  redis:
    image: redis:7
    profiles: [redis]
    command: ["redis-server", "--appendonly", "yes"]   # AOF — 보조 큐로 쓸 때 영속성
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  # event-kafka 모듈용 단일 노드 (KRaft). 앱은 localhost:9092 로 붙는다
  kafka:
    image: apache/kafka:3.9.1
    profiles: [kafka]
    ports:
      - "127.0.0.1:9092:9092"

  # notification-mail 모듈용 개발 SMTP: 앱 → localhost:1025, 받은 메일은 http://localhost:8025
  mail:
    image: axllent/mailpit:v1.21
    profiles: [mail]
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025"   # 앱은 MAIL_SMTP_PORT 를 읽는다 (apps/sample 의 application-local.yml)
      - "127.0.0.1:${MAIL_HTTP_PORT:-8025}:8025"   # 받은 메일 UI · API (e2e 는 GET /api/v1/messages 로 링크를 꺼낸다)

  # storage-s3 모듈로 조립한 앱의 로컬 S3 (R2 대역, SeaweedFS). scripts/dev.sh 가 올린다 (손으로는 --profile s3 로 s3 를 띄우고 s3-init 을 한 번 돌린다).
  # 서버 → http://localhost:8333, 브라우저 직접 업로드 → 같은 주소. 키 dev / dev-secret, 버킷 app.
  # 설정은 application-local.yml (new-project.sh 가 storage-s3 를 고르면 붙인다 — docs/storage-s3.md "Local container")
  s3:
    image: chrislusf/seaweedfs:4.47
    profiles: [s3]
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    configs:
      - source: s3-identity
        target: /etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"   # 다른 포트면 S3_PORT=18333 (서버 → 이 주소 · 브라우저 직접 업로드도 같은 주소라 서버 설정도 같은 값이어야 한다)
    volumes:
      - s3-data:/data

  # 버킷과 CORS(브라우저가 직접 PUT — ETag 노출)를 만들고 끝나는 1회성 작업. 이미 있으면 그대로 둔다. 로컬 전용(127.0.0.1 에만 열림)이라 origin 은 *
  # (SeaweedFS 는 `http://localhost:*` 같은 포트 와일드카드를 받지 않는다 — 실측: 프리플라이트 403)
  s3-init:
    image: amazon/aws-cli:2.31.0
    profiles: [s3]
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev-secret
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://s3:8333
    configs:
      - source: s3-cors
        target: /etc/cors.json
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0; until aws s3api list-buckets >/dev/null 2>&1; do i=$$((i+1)); [ $$i -ge 60 ] && echo "s3 가 60초 안에 안 떴다" && exit 1; sleep 1; done
        aws s3api head-bucket --bucket app 2>/dev/null || aws s3api create-bucket --bucket app
        aws s3api put-bucket-cors --bucket app --cors-configuration file:///etc/cors.json

  # S3_PORT 가 8333 이 아닐 때 s3 와 망을 나눠 쓰는 영상 일꾼이 서명 주소(localhost:S3_PORT)로 닿게 하는 포트 이음. 8333 이면 할 일이 없어 그냥 잔다
  s3-alias:
    image: alpine/socat
    profiles: [video]
    depends_on: [s3]
    network_mode: "service:s3"
    environment:
      S3_PORT: ${S3_PORT:-8333}
    entrypoint: ["sh", "-c", "[ \"$$S3_PORT\" = 8333 ] && exec sleep infinity; exec socat TCP-LISTEN:$$S3_PORT,fork,reuseaddr TCP:127.0.0.1:8333"]

  # video 모듈로 조립한 앱의 로컬 영상 변환 일꾼(apps/video-worker) - 세 차선(원본 단 · 호환 · 사다리) 전부, 상주. scripts/dev.sh 가 이미지를 만들어 올린다
  # (손으로는 `./gradlew :apps:video-worker:installDist` 뒤 `docker compose --profile s3 --profile video up -d --build video-worker`). 로컬 일꾼 토큰은 앱의 application-local.yml
  # (skeleton.video.worker-token-sha256)이 해시로 아는 로컬 전용 값이다 - 운영 토큰은 운영자 발급 API 가 한 번 보여 준다(docs/deploy.md §7).
  # **s3 와 네트워크를 나눠 쓴다**(network_mode): 비공개 영상의 재생 목록 안 조각 주소는 서버가 서명한 저장소 주소(localhost:S3_PORT)라, 일꾼 컨테이너 안에서도 localhost:8333 이
  # 로컬 S3 로 닿아야 한다. S3_PORT 를 8333 이 아닌 값으로 바꾸면 곁 컨테이너(s3-alias)가 그 포트를 s3 의 8333 으로 이어 준다. 앱은 호스트에서 돌아 host.docker.internal 로 닿는다(Docker Desktop 에서 확인. 리눅스 엔진은 host.docker.internal 이 기본으로 없어 직접 이어 줘야 한다 - 확인하지 않았다).
  # 격리: 비루트 · 읽기 전용 루트 · cap_drop ALL · pids 상한 · tmpfs /tmp · 쓰기는 /work 볼륨만. 자원: CPU 2 · 메모리 3GB(4K 사다리는 1GB 에서 OOM - docs/deploy.md 메모리 표) · 낮은 우선순위(nice + cpu_shares)
  video-worker:
    build: apps/video-worker
    profiles: [video]
    depends_on: [s3, s3-alias]
    network_mode: "service:s3"
    environment:
      VIDEO_WORKER_API: http://host.docker.internal:${SERVER_PORT:-8080}   # 앱 주소 - 비공개 영상의 입력 재생 목록 경로(/api/v1/videos/play/…)도 이 출처로 푼다
      VIDEO_WORKER_TOKEN: local-dev-only-video-worker-token
      VIDEO_WORKER_ID: local-worker
      VIDEO_WORKER_LANES: REMUX,COMPAT,LADDER,ANIMATED
      VIDEO_WORKER_MODE: poll
      VIDEO_WORKER_NICE: "10"
      VIDEO_WORKER_HEALTH_PORT: "8081"   # s3 컨테이너가 8080 을 쓴다(SeaweedFS 볼륨 서버)
    mem_limit: 3g
    cpus: 2
    cpu_shares: 256   # 기본 1024 의 1/4 - 다른 일과 같이 쓸 때 양보한다
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    volumes:
      - video-work:/work
    restart: unless-stopped

  app:
    build: .
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: dev
    ports:
      - "8080:8080"

configs:
  s3-identity:
    content: |
      {"identities":[{"name":"dev","credentials":[{"accessKey":"dev","secretKey":"dev-secret"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"anonymous","actions":["Read:app/public/*"]}]}
  s3-cors:
    content: |
      {"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":600}]}

volumes:
  postgres-data:
  mysql-data:
  redis-data:
  s3-data:
  video-work:
