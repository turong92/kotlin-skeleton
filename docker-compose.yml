services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  # db-mysql 모듈로 조립한 앱용: --profile mysql
  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: dev-root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: dev
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # 아래 세 서비스는 해당 모듈을 얹은 앱용이다. `docker compose up` 만으로는 뜨지 않는다 — 필요한 것만 프로필로 켠다:
  #   docker compose --profile redis up -d        (redis-core · redis-lock · redis-cache · redis-rate-limit)
  #   docker compose --profile kafka --profile mail up -d
  redis:
    image: redis:7
    profiles: [redis]
    command: ["redis-server", "--appendonly", "yes"]   # AOF — 보조 큐로 쓸 때 영속성
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  # event-kafka 모듈용 단일 노드 (KRaft). 앱은 localhost:9092 로 붙는다
  kafka:
    image: apache/kafka:3.9.1
    profiles: [kafka]
    ports:
      - "127.0.0.1:9092:9092"

  # notification-mail 모듈용 개발 SMTP: 앱 → localhost:1025, 받은 메일은 http://localhost:8025
  mail:
    image: axllent/mailpit:v1.21
    profiles: [mail]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  app:
    build: .
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: dev
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  mysql-data:
  redis-data:
