# 컨테이너 · 볼륨 이름의 접두사 — 폴더 이름(api · web 처럼 흔한 이름)에 기대면 다른 프로젝트와 섞인다. new-project.sh 가 새 이름으로 바꾼다
name: kotlin-skeleton
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "app"]
      interval: 2s
      retries: 30

  # db-mysql 모듈로 조립한 앱용: --profile mysql
  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: dev-root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: dev
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # 아래 세 서비스는 해당 모듈을 얹은 앱용이다. `docker compose up` 만으로는 뜨지 않는다 — 필요한 것만 프로필로 켠다:
  #   docker compose --profile redis up -d        (redis-core · redis-lock · redis-cache · redis-rate-limit)
  #   docker compose --profile kafka --profile mail up -d
  redis:
    image: redis:7
    profiles: [redis]
    command: ["redis-server", "--appendonly", "yes"]   # AOF — 보조 큐로 쓸 때 영속성
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  # event-kafka 모듈용 단일 노드 (KRaft). 앱은 localhost:9092 로 붙는다
  kafka:
    image: apache/kafka:3.9.1
    profiles: [kafka]
    ports:
      - "127.0.0.1:9092:9092"

  # notification-mail 모듈용 개발 SMTP: 앱 → localhost:1025, 받은 메일은 http://localhost:8025
  mail:
    image: axllent/mailpit:v1.21
    profiles: [mail]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # storage-s3 모듈로 조립한 앱의 로컬 S3 (R2 대역, SeaweedFS). scripts/dev.sh 가 올린다 (손으로는 --profile s3 로 s3 를 띄우고 s3-init 을 한 번 돌린다).
  # 서버 → http://localhost:8333, 브라우저 직접 업로드 → 같은 주소. 키 dev / dev-secret, 버킷 app.
  # 설정은 application-local.yml (new-project.sh 가 storage-s3 를 고르면 붙인다 — docs/storage-s3.md "Local container")
  s3:
    image: chrislusf/seaweedfs:4.47
    profiles: [s3]
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    configs:
      - source: s3-identity
        target: /etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data

  # 버킷과 CORS(브라우저가 직접 PUT — ETag 노출)를 만들고 끝나는 1회성 작업. 이미 있으면 그대로 둔다. 로컬 전용(127.0.0.1 에만 열림)이라 origin 은 *
  # (SeaweedFS 는 `http://localhost:*` 같은 포트 와일드카드를 받지 않는다 — 실측: 프리플라이트 403)
  s3-init:
    image: amazon/aws-cli:2.31.0
    profiles: [s3]
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev-secret
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://s3:8333
    configs:
      - source: s3-cors
        target: /etc/cors.json
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0; until aws s3api list-buckets >/dev/null 2>&1; do i=$$((i+1)); [ $$i -ge 60 ] && echo "s3 가 60초 안에 안 떴다" && exit 1; sleep 1; done
        aws s3api head-bucket --bucket app 2>/dev/null || aws s3api create-bucket --bucket app
        aws s3api put-bucket-cors --bucket app --cors-configuration file:///etc/cors.json

  app:
    build: .
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: dev
    ports:
      - "8080:8080"

configs:
  s3-identity:
    content: |
      {"identities":[{"name":"dev","credentials":[{"accessKey":"dev","secretKey":"dev-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
  s3-cors:
    content: |
      {"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":600}]}

volumes:
  postgres-data:
  mysql-data:
  redis-data:
  s3-data:
