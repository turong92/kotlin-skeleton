# migration (+ migration-flyway) — 스키마 마이그레이션 공통 설정. Flyway 자체 설정은 spring.flyway.* (docs/schema-management.md).
skeleton:
  migration:
    clean-on-validation-error: false   # true 면 검증 실패 때 DB 를 지우고 다시 migrate. clean-allowed-profiles 밖에서 켜면 기동 실패 (스켈레톤 앱들은 로컬에서도 false — 버려도 되는 로컬 DB 한 번만 SKELETON_MIGRATION_CLEAN_ON_VALIDATION_ERROR=true)
    clean-allowed-profiles: [local]    # clean 을 허용하는 프로필
