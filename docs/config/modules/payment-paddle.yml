# payment-paddle — Paddle Billing(해외 결제, 판매 대행). 기본 꺼짐.
skeleton:
  payment-paddle:
    enabled: false                       # true + 세 비밀이 모두 있어야 제공자 빈이 생긴다 (하나라도 비면 이 결제사만 꺼진다)
    provider-id: paddle                  # 라우팅에서 쓰는 ID — 웹훅 주소 /api/v1/payments/webhooks/paddle
    client-name: payment-paddle          # 외부 HTTP 클라이언트 이름
    api-key: ""                          # 서버가 Paddle API 를 부르는 키 (env 로 넘긴다)
    client-token: ""                     # Paddle.js 클라이언트 토큰 (공개해도 된다)
    webhook-secret: ""                   # 웹훅 엔드포인트 비밀값 (env 로 넘긴다)
    environment: sandbox                 # sandbox | live
    base-url: ""                         # 비우면 환경에 따른 기본 주소 (시험의 가짜 Paddle 은 여기에)
    create-transaction-timeout: 5s       # 거래 만들기(주문 · 구독 시작이 기다리는 호출) 한 번의 제한 시간
    lookup-timeout: 5s                   # 거래 조회(환불 전 확인 · 맞추기) 한 번의 제한 시간
    refund-timeout: 10s                  # 환불(adjustment 만들기) 호출의 제한 시간 - 넘으면 결과를 모르는 것으로 읽고 다시 보내지 않는다
    signature-tolerance: 60s             # 서명 시각이 지금과 이보다 멀면 거절
    prices: {}                           # 플랜 코드 · 상품 코드 → Paddle 가격 id (pri_…)
    supported-currencies: []             # 비우면 통화로 라우팅하지 않는다
    supported-countries: []              # 비우면 국가로 라우팅하지 않는다
# 프로젝트 여럿(skeleton.projects)이면 skeleton.projects.<id>.config.payment-paddle.* 로 프로젝트마다 — 그 프로젝트에서 켜지 않으면 그 프로젝트의 결제 화면에 없다
