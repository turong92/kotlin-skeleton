# point — 포인트 원장(적립 · 소멸 임박 순 차감 · 소멸 · 운영자 조정). 저장소는 point-jdbc.
skeleton:
  point:
    admin:
      enabled: false   # true 면 /api/v1/admin/points 를 연다 (꺼짐 → 404). 쓰려면 권한 point.manage 가 있어야 한다
    http:
      enabled: true    # false 면 사용자 경로 /api/v1/points 를 닫는다 (포인트를 쓰는 길은 서버 API PointWallet 뿐이라 읽기만 있다)
    operations:        # 작업 기록(PointOperations) - 불명 건 조회. job-queue-jdbc 가 있을 때만 일한다 (이름은 payment 의 reconcile 과 같다)
      reconcile:
        first-delay: 60s   # 영수증을 받은 뒤 첫 조회까지. 진행 중이던 원장 쓰기가 이보다 늦게 끝나면 조회가 한 번 더 돈다. 양수여야 한다
        max-attempts: 12   # 조회 작업의 시도 수 - 다 쓰면 작업을 포기(ABANDONED)로 닫는다(그 뒤 원장 줄이 나타나도 resolve 를 부르면 성공으로 바로잡는다 - 작업 id 를 아는 쪽이 부른다). 1 이상
