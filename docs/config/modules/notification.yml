# notification — 받은편지함 HTTP 엔드포인트 (GET /api/v1/notifications · GET …/unread-count · GET/PUT …/preferences · PATCH …/{eventId}/read · PATCH …/read-all)와 보관 정리. 접두사는 skeleton.notification.inbox · skeleton.notification.retention · skeleton.notification.preferences · skeleton.notification.advertising.
skeleton:
  notification:
    inbox:
      enabled: true                # false 면 엔드포인트를 등록하지 않는다 (서블릿 앱 + Spring Security 가 있을 때만 등록)
    retention:
      enabled: false               # true 면 interval 마다 max-age 가 지난 받은편지함 줄을 지운다 (기본 꺼짐 - 보관 정책은 앱이 정한다). scheduler 모듈의 skeletonTaskScheduler 가 있어야 돈다
      max-age: 90d                 # 알림 시각이 이 기간보다 오래된 줄을 읽음 여부와 무관하게 지운다
      interval: 1h                 # 정리를 도는 간격
    preferences:
      types: []                    # 사용자가 끌 수 있는 알림 type 목록 (설정 화면에 이 순서로 나온다). 비면 끌 수 있는 종류가 없다 - 목록에 없는 종류(보안 · 결제 알림 …)는 끌 수 없다
    advertising:                   # 광고성 정보 규칙(정보통신망법 §50 관행 - 법률 자문이 아니다). 채널과 무관한 부품 AdvertisingGate 의 설정 - 푸시 채널이 지금 이 규칙을 부른다
      types: []                    # 광고성 알림 종류 (제품이 정한다). 기본 빈 목록 = 광고 규칙 꺼짐. 설정하면 동의 정책 빈(notification-legal)과 아래 fallback-zone · sender-name 이 필수 - 없으면 시작이 실패한다
      consent-type: marketing      # legal 문서 종류 - 광고 수신 동의
      night-consent-type: marketing-night  # 야간(21~08시) 수신 별도 동의 (다른 문서 · 다른 체크박스)
      night-start: "21:00"         # 법정 값이라 모듈 기본으로 둔다 (HH:mm, 이상)
      night-end: "08:00"           # (미만) 야간 동의가 없으면 이 시각까지 보류한다. night-start 와 같으면 시작이 실패한다
      # fallback-zone: Asia/Seoul  # 필수(기본값 없음) - 받는 사람 시간대를 모를 때(AdvertisingRecipientZones 가 null). 시스템 기본 시간대는 쓰지 않는다
      # sender-name: Example Co.   # 필수(기본값 없음) - 전송자 명칭 (동의 변경 · 재확인 안내에 쓴다)
      reconfirm-after: 730d        # 동의 유효 기간 - 가장 최근 동의 + 이 기간이 지나면 없는 것으로 본다 (2년)
      reconfirm-notice-before: 30d # 만료 이 기간 전부터 재확인 안내를 동의 주기당 한 번 보낸다
      reconfirm-scan-interval: 6h  # 재확인 안내 스캔 간격 (scheduler 모듈의 skeletonTaskScheduler 가 있어야 돈다)
      reconfirm-link: /settings/notifications  # 안내 알림을 누르면 가는 앱 안 경로
      title-prefix: "(광고)"        # 광고 제목 앞 표기 - 앱 factory 가 잊어도 채널이 붙인다
      body-suffix: ""              # 광고 본문 끝에 붙일 문구 (예: 수신 거부: 설정 > 알림)
