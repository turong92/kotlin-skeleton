# legal — 약관 · 개인정보 처리방침 · 동의 기록. 저장소는 legal-jdbc 가 맡고 설정 접두사는 이것 하나다.
skeleton:
  legal:
    location: classpath:legal/       # 앱이 싣는 문서 디렉터리 (manifest.json + <종류>/<판>.<언어>.md). manifest.json 이 없으면 모듈의 TEMPLATE 문서(prod 에서 막힌다)
    default-locale: ko               # 언어가 없을 때 돌려주는 언어 — 모든 판이 이 언어 원문을 가져야 한다
    required: [terms, privacy]       # 서비스를 쓰려면 현재 판에 동의해야 하는 종류 (리스트는 기본값을 대체한다). 종류 목록은 매니페스트가 정한다
    # required-at-sign-up: [terms, privacy]   # 가입에 필요한 종류 — 안 적으면 required 와 같다
    previous-version-grace: 0s       # 새 판이 시행된 뒤에도 바로 앞 판의 동의를 계속 받는 시간. 0 이면 시행되는 순간 앞 판 동의는 낡은 것
    facts: {}                        # 문서의 {{키}} 를 채운다 — 예: { company-name: ACME, contact-email: help@acme.example }
    acknowledge-template: false      # true 면 모듈의 TEMPLATE 문서를 stage · prod 에서도 일부러 허락한다 (시험 배포용)
    admin-role: ADMIN                # 운영자 읽기 엔드포인트의 역할 이름 (ROLE_ 없이)
    record:
      store-ip: true                 # 동의 기록에 클라이언트 IP 를 남기나 (분쟁 때 증거 — 개인정보라 아래 기간 뒤 비운다)
      store-user-agent: true
      personal-data-retention: 365d  # IP · UA 를 이 기간이 지나면 비운다 (줄은 남는다). 0 이면 무기한
      retention-interval: 1h         # 정리는 기록할 때 이 간격으로 한 번
      max-events-per-day: 200        # 한 주체가 하루에 만들 수 있는 동의 사건 수 (넘으면 429 LEGAL.RATE_LIMITED)
    erasure:
      mode: ANONYMIZE                # 계정 삭제 때: ANONYMIZE 증거는 남기고 사람(주체 id · IP · UA)을 지운다 | DELETE 익명화한 뒤 줄도 지운다
    http:
      enabled: true                  # false 면 컨트롤러를 등록하지 않는다 (서블릿 웹 앱 + Spring Security 가 있을 때만 등록)
      base-path: /api/v1/legal       # 프런트 @skeleton/legal 의 basePath 와 맞춘다
      cache-max-age: 5m              # 공개 문서 읽기의 Cache-Control: public, max-age
    reconsent:
      enabled: false                 # true 면 필수 문서에 동의가 모자란(처음이거나 새 판) 로그인 호출자의 보호된 요청에 403 LEGAL.RECONSENT_REQUIRED
      include-paths: [/api/**]
      exclude-paths: [/api/v1/legal/**, /api/v1/auth/**, /api/v1/account/**]   # 동의 · 로그아웃 · 삭제로 빠져나갈 길
