# storage — 업로드 파일 검증 규칙 + 업로드 HTTP 엔드포인트 (저장소 구현은 storage-s3).
skeleton:
  storage:
    validation:
      max-size-bytes: 9223372036854775807   # 파일 크기 상한 (바이트). 기본은 제한 없음(Long.MAX) — 예: 10485760
      allowed-content-types: []             # 비우면 모든 Content-Type 허용
      allowed-extensions: []                # 비우면 모든 확장자 허용
    web:
      enabled: true                         # false 면 /api/v1/storage 엔드포인트를 등록하지 않는다 (PresignedStorage 빈 = 버킷 설정이 있을 때만 등록)
      key-prefix: uploads                   # 서버가 정하는 키: <key-prefix>/<계정 id>/<uuid>/<파일 이름> (key-owner=OPAQUE 면 <key-prefix>/o/<uuid>.<mac>/file[.<ext>])
      key-owner: ACCOUNT_ID                 # ACCOUNT_ID: 키에 계정 id 가 든다 | OPAQUE: 키에서 계정 id 를 알 수 없다 (작성자 프로필을 쓰는 앱) — key-secret 필요
      public:                               # 게시판 사진의 공개 영역 - 공개된 글 · 댓글의 사진만 공개 주소(CDN)로, 나머지는 비공개 (docs/modules/storage.md)
        enabled: false                      # 기본 꺼짐 - 앱 yml 이 명시해야 켜진다 (꺼진 채에서는 응답에 attachmentUrls 가 없다)
        secret: ""                          # 공개 키 HMAC 의 서버 비밀(32자 이상, 비밀 - env <P>_STORAGE_WEB_PUBLIC_SECRET). enabled 인데 비면 기동 실패. 프로젝트마다 달라야 한다
        prefix: public                      # 공개 영역의 접두사 - 업로드 접두사(key-prefix)와 겹치면 기동 실패. 이 접두사만 읽기 공개로 연다
        base-url: ""                        # 공개 주소의 앞부분 - <base-url>/<공개 키>. enabled 면 필수. CDN 절대 주소(https://cdn.example.com/app) 또는 같은 출처의 상대 경로(/files - 프록시가 공개 접두사로 넘긴다)
        cache-control: "public, max-age=3600"   # 공개 객체의 Cache-Control - 가린 뒤에도 CDN 에 남는 시간의 상한 (즉시 제거는 PublicUploadPurger)
        access-ttl: 5m                      # 승인 전 · 판 사진을 관리하는 사람이 볼 때의 서명 주소 수명
        purge:                              # 공개 객체를 지운 뒤 CDN 캐시를 비운다 (기본 꺼짐; 구현은 Cloudflare 하나, 다른 CDN 은 PublicUploadPurger 빈을 둔다)
          cloudflare:
            enabled: false                  # true 면 zone-id · api-token 이 필요하다. 객체 삭제가 먼저이고, purge 가 실패하면 조정자가 큐로 다시 시도한다
            zone-id: ""                     # Cloudflare 존 id (비밀 아님 - env <P>_STORAGE_WEB_PUBLIC_PURGE_CLOUDFLARE_ZONE_ID)
            api-token: ""                   # 비밀 - env <P>_STORAGE_WEB_PUBLIC_PURGE_CLOUDFLARE_API_TOKEN. Zone -> Cache Purge 권한만 준 토큰
            public-origin: ""               # base-url 이 상대 경로(/files)일 때 필요: purge 가 CDN 에 이름 붙일 절대 주소의 앞부분 (https://app.example.com)
            api-url: https://api.cloudflare.com/client/v4
            timeout: 5s
      guest:                                # 로그인하지 않은 사람의 이미지 업로드 - POST /api/v1/storage/guest/presign 하나만 익명에 열린다 (docs/modules/storage.md)
        enabled: false                      # 기본 꺼짐 - 앱 yml 이 명시해야 켜진다 (꺼진 채에서는 익명 발급이 401)
        secret: ""                          # 키 MAC 의 서버 비밀(32자 이상, 비밀 - env <P>_STORAGE_WEB_GUEST_SECRET). enabled 인데 비면 기동 실패. 프로젝트마다 달라야 한다
        allowed-content-types: [image/jpeg, image/png, image/webp, image/gif]   # 이 넷 안에서만 고를 수 있다 (SVG 는 설정으로도 열 수 없다)
        max-size-bytes: 10485760            # 파일 하나의 상한 (10 MB)
        rate-limit:
          capacity: 20                      # IP 별 발급 한도
          window: 1h
        captcha: OFF                        # OFF | REQUIRED - REQUIRED 면 발급에 captchaToken 이 필요하고 검증기(captcha-turnstile)가 없으면 기동 실패
        cleanup:
          enabled: false                    # true 면 ttl 안에 글 · 댓글에 붙지 않은 비회원 업로드를 주기 작업(scheduler 모듈 필요)이 지운다
          ttl: 24h
          batch-size: 500
      key-secret: ""                        # OPAQUE 키의 HMAC 비밀(32자 이상, 비밀 — env <P>_STORAGE_WEB_KEY_SECRET). OPAQUE 인데 비면 기동 실패. 바꾸면 발급한 OPAQUE 키가 맞지 않게 된다
