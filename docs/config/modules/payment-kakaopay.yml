# payment-kakaopay — 카카오페이 단건 결제 제공자(온라인 결제 REST: 결제 준비 → 구매자 승인 → 서버 승인 → 취소 · 조회). 기본 꺼짐.
skeleton:
  payment-kakaopay:
    enabled: false                                  # true + secret-key + cid 면 제공자 빈이 생긴다. 켰는데 secret-key 나 cid 가 비면 빈이 없고, 보호 환경(skeleton.env=stage|prod)에서는 배포 가드가 기동을 막는다 (그 밖의 환경은 경고)
    provider-id: kakaopay                           # 라우팅에서 쓰는 ID
    client-name: payment-kakaopay                   # 외부 HTTP 클라이언트 이름 (skeleton.http.clients.<이름>.response-timeout 이 승인 · 환불의 응답 제한)
    secret-key: ""                                  # 개발자센터 앱의 Secret key — 테스트는 「Secret key(dev)」 (env <P>_PAYMENT_KAKAOPAY_SECRET_KEY 로 넘긴다 — 배포 선언의 secrets:, 운영자 값). 보호 환경에서 비면 기동 실패
    cid: ""                                         # 가맹점 코드(CID, 10자) — 테스트는 TC0ONETIME. 키 모양이 아니라 이 코드가 테스트 · 실결제를 가른다: 보호 환경(stage|prod)에서 테스트 코드면 기동 실패, 로컬 계열에서 실결제 코드면 기동 실패. 비밀은 아니다 — env <P>_PAYMENT_KAKAOPAY_CID (선언의 env:). secret-key 와 짝이라 프로젝트 모드는 프로젝트마다 자기 것
    cid-secret: ""                                  # 가맹점 코드 인증키(선택, 24자) — 발급받았을 때만. 비밀 (env <P>_PAYMENT_KAKAOPAY_CID_SECRET)
    subscription-cid: ""                            # 정기 결제 가맹점 코드(테스트 TCSUBSCRIP) — 설정하면 구독 능력이 선다(1회차 결제가 곧 등록, 승인 응답의 SID 로 갱신). 비면 구독 없음. cid 와 같은 모드여야 한다(다르면 기동 실패). 이 코드에는 cid-secret 을 보내지 않는다 (env <P>_PAYMENT_KAKAOPAY_SUBSCRIPTION_CID)
    subscription-path: /online/v1/payment/subscription   # 정기 결제(SID) 승인 경로
    inactive-path: /online/v1/payment/manage/subscription/inactive   # SID 비활성 경로
    status-path: /online/v1/payment/manage/subscription/status       # SID 상태 조회 경로 (비활성이 실패했을 때 이미 비활성인지 확인)
    return-url: ""                                  # 구매자를 돌려보낼 우리 화면의 주소(예: https://app.example.com/payments/return) — 카카오페이는 ready 때 성공 · 취소 · 실패 주소를 서버가 받는다. 모듈이 kind · provider · order · result 조각을 붙이고 성공일 때 카카오페이가 pg_token 을 붙인다. 구매자가 정하는 값이 아니라 설정이다. 장부가 있는데 http(s) 절대 주소가 아니면 보호 환경에서 기동 실패(그 밖은 경고, GET /config 가 available:false). 프로젝트 모드는 프로젝트마다 자기 것(공통에서 물려받으면 기동 실패)
    allowed-return-origins: []                      # 결제를 시작한 화면의 origin 으로 돌아오게 허락하는 목록(예: [http://localhost:5173]) — 주문 만들기의 returnOrigin 이 여기 있을 때만 return-url 의 scheme · host 를 그 origin 으로 바꾼다(로그인 저장소가 origin 마다 따로라서). 목록 밖이거나 비면 return-url 그대로 — 열린 리다이렉트가 되지 않는다. 허락한 origin 마다 카카오 개발자센터 「플랫폼 > Web > 사이트도메인」 등록이 필요하다(안 하면 ready -400, 반영에 몇 분). origin 모양이 아닌 줄은 무시되어 경고(stage|prod 는 기동 실패), stage|prod 는 https 만. 프로젝트 모드는 프로젝트마다 자기 것(공통에서 물려받으면 기동 실패)
    base-url: https://open-api.kakaopay.com         # API 호스트 (테스트와 운영이 같은 호스트 — 키와 가맹점 코드가 환경을 가른다)
    ready-path: /online/v1/payment/ready            # 결제 준비 경로
    approve-path: /online/v1/payment/approve        # 결제 승인 경로
    cancel-path: /online/v1/payment/cancel          # 취소 · 환불 경로
    order-path: /online/v1/payment/order            # 주문 조회 경로 (거래 번호 tid 로만 묻는다)
    ready-timeout: 10s                              # 결제 준비 한 번의 제한 시간(요청 단위 — 클라이언트 단위 응답 제한보다 짧을 때만 뜻이 있다)
    lookup-timeout: 10s                             # 조회 한 번의 제한 시간(요청 단위)
    allow-test-keys-in-protected-env: false         # true 면 skeleton.env=stage|prod 에서 테스트 가맹점 코드로 서는 것을 일부러 허락한다(경고로 내려간다)
    supported-currencies: [KRW]                     # 이 통화는 이 제공자로 라우팅
    supported-countries: [KR]                       # 이 국가는 이 제공자로 라우팅
# 프로젝트 여럿(skeleton.projects)이면 skeleton.projects.<id>.config.payment-kakaopay.* 로 프로젝트마다 — 그 프로젝트에서 켜지 않으면 그 프로젝트의 결제 화면에 없다
