# payment-appstore — App Store 앱 안 결제(구매 확인 + 서버 알림 V2). 기본 꺼짐.
skeleton:
  payment-appstore:
    enabled: false                       # true + 다섯 값이 모두 있어야 결제사 빈이 생긴다 (하나라도 비면 이 결제사만 꺼지고, 보호 환경 stage · prod 에서는 기동 실패)
    provider-id: appstore                # 라우팅에서 쓰는 ID — 알림 주소 /api/v1/payments/webhooks/appstore
    client-name: payment-appstore        # 외부 HTTP 클라이언트 이름
    bundle-id: ""                        # 앱의 번들 id (예: com.example.app) — 애플이 서명한 거래 · 알림의 bundleId 가 이것과 같아야 한다
    app-apple-id: ""                     # 앱의 App Store 숫자 id — 운영 알림 · 구독 상태 응답이 이것과 같아야 한다
    issuer-id: ""                        # App Store Connect 인앱 구매 키의 Issuer ID (env 로 넘긴다)
    key-id: ""                           # 그 키의 Key ID (env 로 넘긴다)
    private-key: ""                      # 그 키(.p8)의 PKCS#8 PEM 본문 — 비밀 (env 로 넘긴다)
    base-url: ""                         # 비우면 https://api.storekit.apple.com (시험의 가짜 서버는 여기에) — 보호 환경에서 애플 주소가 아니면 기동 때 경고
    sandbox-base-url: ""                 # 비우면 https://api.storekit-sandbox.apple.com — 운영이 거래를 모른다(404)고 하면 여기에 묻는다
    lookup-timeout: 5s                   # 거래 · 구독 조회 한 번의 제한 시간
# 신뢰하는 애플 루트(Apple Root CA - G3)는 모듈에 들어 있고 바꾸는 설정이 없다 — 시험만 AppStoreSignatureVerifier 빈을 바꿔 끼운다
# 프로젝트 여럿(skeleton.projects)이면 skeleton.projects.<id>.config.payment-appstore.* 로 프로젝트마다 — 그 프로젝트에서 켜지 않으면 그 프로젝트에 없다
