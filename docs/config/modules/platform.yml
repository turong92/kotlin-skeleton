# platform — 웹 정책 · 외부 HTTP · 로깅 마스킹 · OpenAPI · 설정 검증 · 관측 링크. platform 은 모든 앱이 얹는다.
# 여러 접두사를 한 파일에 담았다 — 바꿀 블록만 복사한다.
skeleton:
  web:
    public-endpoints: []                       # 인증 없이 여는 경로 [{ method: GET, path: /health-check }]. 모듈은 PublicEndpointContributor 로 더한다
    forwarded-headers:
      enabled: true                            # X-Forwarded-* 헤더 해석
    security-headers:
      enabled: true                            # 보안 응답 헤더
      content-security-policy: ""              # 비우면 CSP 헤더를 보내지 않는다
      hsts:
        enabled: true                          # Strict-Transport-Security
        max-age: 31536000                      # 초 (1년)
        include-sub-domains: true
    cors:
      enabled: false                           # 앱이 프론트 Origin 을 정해 켠다
      path-pattern: /api/**                    # CORS 를 적용할 경로
      allowed-origin-patterns: ["http://localhost:[*]", "http://127.0.0.1:[*]"]
      allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      allowed-headers: [Authorization, Content-Type, Idempotency-Key, traceparent, X-Request-Id, X-Trace-Id, X-Time-Zone, X-Dev-Account-Id, X-Dev-Username, X-Dev-Email, X-Break-Glass-Account-Id, X-Break-Glass-Reason, X-Break-Glass-Secret, X-Board-Guest-Secret, X-Workspace-Id]
      exposed-headers: [Location, Idempotency-Key, Idempotency-Replayed, traceparent, X-Trace-Id, X-Span-Id, Date]   # Date: 서버 시각 (프론트 카운트다운 보정)
      allow-credentials: false
      max-age: 1h
    client-ip:
      # mode: proxy                           # direct | proxy | cloudflare. 비우면 지금까지처럼 remoteAddr 그대로 — ForwardedHeaderFilter 가 X-Forwarded-For 로 덮어써 직접 붙은 호출자가 IP 를 고른다 (docs/client-ip.md)
      trusted-proxies: ["127.0.0.0/8", "::1/128"]   # 전달 헤더를 믿을 피어 CIDR
    rate-limit:
      enabled: false                           # 요청 속도 제한 (기본 저장소는 인메모리, 공유하려면 redis-rate-limit)
      path-pattern: /api/**                    # 한 경로 패턴 (지금까지 그대로)
      # path-patterns: [/api/v1/badges/accounts/**, /api/v1/reviews/targets/**]   # 여러 경로에 걸려면 목록 - 기본은 비어 있다. 하나라도 있으면 path-pattern 을 대신한다(합치지 않는다). 목록의 경로는 한 클라이언트(IP)가 한 카운터를 나눠 쓴다
      capacity: 60                             # 창(window) 안에 허용하는 요청 수
      window: 1m
  http:
    default-connect-timeout: 2s                # 외부 HTTP 기본 연결 타임아웃
    default-response-timeout: 5s               # 외부 HTTP 기본 응답 타임아웃
    max-in-memory-size: 2MB                    # 응답 본문 메모리 상한
    vendor-trace-headers: [X-Provider-Trace-Id, X-Request-Id, X-Correlation-Id, X-Amzn-Trace-Id, Stripe-Request-Id, Request-Id]   # 벤더 추적 ID 로 기록할 응답 헤더
    logging:
      enabled: true                            # 외부 호출 로그
      include-query: false
      include-headers: false
      include-body: false
    clients: {}                                # 이름 → { base-url, connect-timeout, response-timeout, default-headers, vendor-trace-headers }
  authz:
    # roles:                                   # 역할 → 권한 목록. 주면 기본 매핑을 통째로 이긴다 (전권 `*` 는 super-role 만, 키는 붙은 모듈이 선언한 것만)
    #   CS: [payment.read, payment.refund]
    #   MODERATOR: [board.moderate, board.manage]
    # 비우면 기본 매핑: super-role → ["*"] + 붙은 모듈이 선언한 기본 역할 (board: MODERATOR → board.moderate, board.manage)
    # role-includes:                           # 역할 위계 - 역할 → 물려받는 역할. 위가 아래의 권한을 모두 얻는다(전이적, 순환 금지). 순환 · 없는 역할 · 전권 포함 · 전권에 includes 는 기동 실패. authz-jdbc 에서는 첫 기동의 씨앗이다
    #   STAFF: [CS, MODERATOR]
    super-role: ADMIN                          # 전권(`*`)을 가진 단 하나의 역할
    cache-ttl: 30s                             # 역할 → 권한 캐시 수명 (authz-jdbc 가 쓴다). 0 = 캐시 끔
  redaction:
    replacement: "[REDACTED]"                  # 마스킹 대체 문자열
    additional-sensitive-names: []             # 기본 민감 이름(password, secret, token …)에 더할 이름
    output:                                    # 출력 끝 로그 마스킹 — 앱이 logback 조각을 include 했을 때만 적용 (docs/logging.md)
      patterns: []                             # 기본 규칙(Authorization · Bearer · JWT · token/secret/password 쌍)에 더하는 정규식. 이름 있는 그룹 (?<value>…) 이 있으면 그 부분만 가린다
      mask-emails: false                       # true 면 이메일을 a***@d***.com 으로
  openapi:
    title: kotlin-skeleton API                 # API 문서 제목
    version: 0.1.0
    description: Composable Kotlin backend skeleton API
  config:
    validation:
      enabled: true                            # 필수 설정 검증
      fail-fast: true                          # 누락이면 기동 실패 (false 면 경고)
      dummy-markers: [change-me, dummy, dev-local, local-secret]   # 값에 이 문자열이 있으면 더미로 본다
      requirements: []                         # 프로필별 필수 설정 목록 — docs/config/required-config.yml 참고
  # 배포 환경 스위치 skeleton.env (환경변수 SKELETON_ENV = local | stage | prod) 는 이 접두사 밖의 키 하나다 — 비우면 스위치 없음 (docs/deploy.md)
  deploy:
    require-env: false                         # true 면 skeleton.env 가 비었을 때 기동 실패 (기본은 옵트인 — 비워도 뜬다)
  observability:
    links:
      enabled: false                           # 알림 · 에러 응답에 로그/트레이스 링크를 붙인다
      custom-fields: []                        # 템플릿에서 쓸 추가 필드
      templates: {}                            # 이름 → { label, kind: LOGS|TRACE|RUN|PROVIDER|CUSTOM, url, required-fields }
  # 한 프로세스에 프로젝트 여럿 (docs/multi-project.md). 기본은 비어 있다 = 서비스 하나. 프로젝트 하나 = 도메인들 + DB 스키마 + 덮어쓸 설정.
  # projects:
  #   a: { hosts: [a.example.com], schema: proj_a, datasource: { username: proj_a, password: ..., pool-max: 3 }, config: { auth.jwt.secret: ..., account.mail.brand: A } }
