# authz — 운영자 역할 관리 API. 저장소는 authz-jdbc 가 맡는다. 이 접두사는 스위치 하나다.
# 역할 → 권한 매핑 자체는 platform 의 설정이다(docs/config/modules/platform.yml) — authz-jdbc 를 붙이면 첫 기동 씨앗으로만 쓰인다:
#     roles: {}          # 역할 → 권한 목록 (비면 ADMIN = * + 모듈 선언의 기본 역할)
#     super-role: ADMIN  # 전권 역할 이름
#     cache-ttl: 30s     # 역할 → 권한 캐시 수명
#     role-includes: {}  # 역할 위계 - 역할 → 물려받는 역할(전이적, 순환 금지; authz-jdbc 에서는 첫 기동 씨앗). 설정 접두사는 skeleton.authz.role-includes
skeleton:
  authz:
    admin:
      enabled: false   # true 면 /api/v1/admin/roles · /api/v1/admin/permissions 를 연다 (꺼짐 → 404). 켜려면 저장소(authz-jdbc)가 필요하다
