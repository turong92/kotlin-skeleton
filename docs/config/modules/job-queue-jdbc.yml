# job-queue-jdbc — DB 재시도 큐 (FOR UPDATE SKIP LOCKED). 접두사는 모듈 이름과 달리 job-queue.
skeleton:
  job-queue:
    enabled: true                  # false 면 모듈이 빈을 만들지 않는다
    worker-enabled: true           # false 면 enqueue 만 되고 워커는 돌지 않는다 (테스트 · 배치 전용 인스턴스)
    poll-interval: 2s              # 워커가 큐를 보는 간격 (안전망 — 같은 프로세스에서 넣은 잡은 커밋 즉시 깨워 바로 돈다)
    concurrency: 1                 # 이 프로세스의 일꾼 스레드 수 (기본 1 = 한 번에 한 묶음). 처리기가 동시에 불려도 안전해야 하고 DB 연결을 이 수만큼 더 쓴다
    batch-size: 10                 # 한 번에 가져오는 작업 수
    max-attempts: 10               # 최대 시도 횟수
    backoff:
      initial: 30s                 # 첫 실패 후 대기
      multiplier: 2.0              # 실패마다 곱하는 배수
      max: 1h                      # 대기 상한
    stale-lock-timeout: 10m        # RUNNING 인 채로 이 시간이 지나면 워커가 죽은 것으로 보고 PENDING 으로 되돌린다 (시도를 다 썼으면 DEAD)
    unhandled-type-grace: 1d       # 이 워커에 처리기가 없는 종류는 집지 않고 둔다 (배포 중 새 버전이 넣은 잡). 이 기간이 지나도 아무도 안 집으면 DEAD
    propagated-mdc-keys: [traceId] # 넣는 쪽 MDC 에서 작업 줄(log_context)로 옮겨 워커 로그에 복원할 키. 비우면 문맥을 싣지 않는다
    retention:
      enabled: false               # true 면 워커가 끝난 줄을 보관 기간 뒤 지운다 (기본 꺼짐 — 보관 정책은 앱이 정한다)
      done: 14d                    # DONE 줄 보관 (updated_at 기준)
      dead: 90d                    # DEAD 줄 보관
      batch-size: 1000             # 한 번에 지우는 줄 수
      interval: 1h                 # 정리를 도는 간격
    mode: polling                  # polling(기본) | on-request — on-request 면 폴링 스레드 없이 깨우기 주소(wake)가 부를 때만 처리한다 (0대 배포용, docs/cloud-run-scale-to-zero.md). 이미지를 만들 때 굳는다
    wake:
      path: /internal/jobs/drain   # 깨우기 주소 (POST, mode=on-request 일 때만 선다)
      secret: ""                   # 공유 비밀값 — 헤더 X-Wake-Secret 과 상수 시간으로 맞춘다. 비면 주소는 닫혀 있다(404). 보호 환경에서 비거나 약하면(24자 미만) 기동 실패
      time-budget: 25s             # 한 번 불렸을 때 새 묶음을 집기를 멈추는 시간 (남은 일감은 다음 호출이 이어받는다)
    worker-id: ""                  # 워커 식별자 (비우면 hostname + 랜덤)
