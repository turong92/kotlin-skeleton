# notification-sse — Server-Sent Events 로 알림 구독. 접두사는 skeleton.notification.sse (점).
skeleton:
  notification:
    sse:
      enabled: true                # false 면 모듈이 빈을 만들지 않는다
      timeout: 30m                 # SSE 연결 유지 시간
      public-endpoint: false       # true 면 구독 엔드포인트를 인증 없이 연다
      # heartbeat: 15s            # 기본 비움 = 꺼짐. 켜면 열린 연결마다 이 간격으로 SSE 주석(`:` 한 줄)을 보낸다 - 15s 가 관행 (Cloudflare 유휴 100초 · 흔한 프록시 60초보다 짧게)
