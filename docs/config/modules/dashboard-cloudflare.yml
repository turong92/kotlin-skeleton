# dashboard-cloudflare — Cloudflare Web Analytics(RUM)에서 방문 · 페이지뷰 · 유입 · 경로 · 국가 · 기기를 읽는다. 계정 id · 사이트 태그 · 토큰이 모두 있어야 연결된 것이다 (아니면 그 카드만 「연결하면 보입니다」).
# 프로젝트 모드(skeleton.projects)에서는 프로젝트마다 자기 config 에 account-id · site-tag · api-token 을 적는다 — 공통 값을 물려받지 않는다 (docs/multi-project.md).
skeleton:
  dashboard-cloudflare:
    account-id: ""                          # Cloudflare 계정 id
    site-tag: ""                            # Web Analytics 사이트 태그
    api-token: ""                           # 비밀 — 환경변수 SKELETON_DASHBOARD_CLOUDFLARE_API_TOKEN. 권한 Account / Account Analytics / Read 하나
    live-cache: 5m                          # 오늘 숫자(직접 질의)의 서버 캐시 수명 — 운영자가 여럿 열어도 외부 호출은 이 주기당 프로젝트당 한 번
    base-url: https://api.cloudflare.com    # 시험의 가짜 Cloudflare 는 여기에 적는다
    client-name: dashboard-cloudflare       # ExternalHttpClient 의 클라이언트 이름 (skeleton.http.clients.<이름> 로 제한 시간 등을 바꾼다)
    timeout: 10s
