# redis-core — Redis 연결 · 키 접두사 · JSON 직렬화. 연결은 첫 명령 때 일어난다 (Redis 없이도 뜬다). 접두사는 모듈 이름과 달리 skeleton.redis.
skeleton:
  redis:
    mode: STANDALONE                           # 지원: STANDALONE
    host: localhost
    port: 6379
    database: 0
    username: ""                               # 비우면 인증 없음
    password: ""
    ssl:
      enabled: false                           # TLS (운영 Redis 는 보통 true)
      disable-peer-verification-local: false   # 로컬에서만 인증서 검증 끄기
    timeout:
      connect: 2s                              # 연결 타임아웃
      command: 2s                              # 명령 타임아웃
    key-prefix: kotlin-skeleton                # 모든 키 앞에 붙는 접두사 (환경마다 다르게: <앱>:<프로필>)
    json:
      trusted-packages: [dev.sumin.skeleton, java.time, java.util]   # JSON 역직렬화를 허용하는 패키지 — 쓰는 도메인 패키지를 더한다
