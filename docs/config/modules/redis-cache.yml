# redis-cache — Redis 캐시(CacheManager). Redis 연결은 redis-core(skeleton.redis). 켜 둬도 Redis 없이 뜬다 (FAIL_OPEN 이면 캐시 오류는 무시).
skeleton:
  redis-cache:
    enabled: true                  # false 면 모듈이 빈을 만들지 않는다
    default-ttl: 10m               # 캐시 항목 기본 TTL
    failure-policy: FAIL_OPEN      # FAIL_OPEN: 캐시 오류를 무시하고 원본 호출 | FAIL_CLOSED: 예외 전파
    no-op-fallback:
      enabled: false               # true 면 Redis 를 쓰지 않는 NoOp 캐시 (로컬 · 테스트)
    caches: {}                     # 캐시 이름 → { ttl } 로 이름별 TTL. 예: { orders: { ttl: 1m } }
