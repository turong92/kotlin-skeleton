# storage-image-ffmpeg - 움직이는 GIF · WebP 표시본을 앱 안에서 ffmpeg 로 소리 없는 반복 MP4(투명이면 움직이는 WebP)로 바꾼다. 기본 꺼짐: 앱 yml 이 켠다. 컨테이너 이미지에 ffmpeg 가 있어야 한다(움직이는 WebP 입력은 8.0 이상).
skeleton:
  storage:
    image:
      ffmpeg:
        enabled: false                      # true 면 storage-image 가 움직이는 이미지를 올린 뒤 변환 작업(job-queue-jdbc)을 한 줄 넣는다. 사본 display 는 먼저 쓰이고 변환이 실패해도 사본이 그대로다. 켜려면 storage-image 도 켜져 있어야 한다
        path: ffmpeg                        # ffmpeg 실행 파일 - 이름(PATH 에서 찾는다)이나 절대 경로 예: /usr/bin/ffmpeg
        timeout: 60s                        # 안전 상한: ffmpeg 프로세스 하나의 시간 - 넘으면 죽이고 실패(큐가 다시 한다). job-queue 의 stale-lock-timeout 보다 짧게 둔다
        max-source-bytes: 20971520          # 안전 상한: 원본 바이트 (20 MB) - 넘으면 변환하지 않고 사본을 쓴다. 변환본이 원본보다 작지 않아도 올리지 않는다
        crf: 27                             # libx264 -crf (0..51) - 낮을수록 고화질 · 큰 파일. 26~28 이 보통의 균형
        preset: veryfast                    # libx264 -preset - 느릴수록 같은 화질에 더 작다 (ultrafast … veryslow)
        pixel-format: yuv420p               # 출력 -pix_fmt - 브라우저 호환은 yuv420p (짝수 크기는 항상 맞춘다)
        max-attempts: 3                     # 변환 작업의 시도 횟수 - 소진되면 DEAD 로 끝나고 사본이 계속 쓰인다
