# 모듈 기본값과 다른 값만 (공통은 application.yml)
spring:
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD:}   # 기본 비밀번호 없이 — 값을 꼭 준다

skeleton:
  config:
    aws:
      ssm:
        region: ${AWS_REGION:ap-northeast-2}
        credential-profile: ${AWS_PROFILE:}
        paths:
          - /kotlin-skeleton/dev/common/
          - /kotlin-skeleton/dev/api/
  redis:
    key-prefix: kotlin-skeleton:dev
  redis-lock:
    startup-check:
      enabled: true
  event-kafka:
    environment: dev
  auth:
    jwt:
      secret: ${JWT_SECRET:}                  # 기본 비밀 없이 — 값을 꼭 준다
  web:
    cors:
      enabled: true
