# 모듈 기본값과 다른 값만 (공통은 application.yml)
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}

skeleton:
  config:
    aws:
      ssm:
        region: ${AWS_REGION:ap-northeast-2}
        credential-profile: ${AWS_PROFILE:}
        paths:
          - /kotlin-skeleton/prod/common/
          - /kotlin-skeleton/prod/api/
  redis:
    key-prefix: kotlin-skeleton:prod
    ssl:
      enabled: true   # 관리형 Redis 전제. 사설 네트워크의 평문 Redis(홈서버 배포)는 환경변수 SKELETON_REDIS_SSL_ENABLED=false — 환경변수가 이 값을 이긴다 (ProdRedisSslEnvironmentTest)
  redis-lock:
    startup-check:
      enabled: true
  event-kafka:
    environment: prod
