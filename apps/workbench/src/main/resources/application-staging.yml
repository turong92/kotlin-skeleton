# 모듈 기본값과 다른 값만 (공통은 application.yml)
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}

skeleton:
  config:
    aws:
      ssm:
        region: ${AWS_REGION:ap-northeast-2}
        credential-profile: ${AWS_PROFILE:}
        paths:
          - /kotlin-skeleton/staging/common/
          - /kotlin-skeleton/staging/api/
  redis:
    key-prefix: kotlin-skeleton:staging
    ssl:
      enabled: true
  redis-lock:
    startup-check:
      enabled: true
  event-kafka:
    environment: staging
