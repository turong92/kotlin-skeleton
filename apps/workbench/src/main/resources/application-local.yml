# 모듈 기본값과 다른 값만 (공통은 application.yml)
skeleton:
  migration:
    clean-on-validation-error: false  # 동결된 마이그레이션(migrations.lock)은 로컬에서도 조용히 DB 를 지우지 않는다 — 검증 오류면 기동이 실패한다. 정말 버릴 로컬 DB 만: SKELETON_MIGRATION_CLEAN_ON_VALIDATION_ERROR=true (docs/schema-management.md)
  config:
    aws:
      ssm:
        region: ${AWS_REGION:ap-northeast-2}
        credential-profile: ${AWS_PROFILE:}   # AWS_PROFILE 이 있으면 local 에서도 SSM 을 읽는다
        paths:
          - /kotlin-skeleton/dev/common/
          - /kotlin-skeleton/dev/api/
          - /kotlin-skeleton/local/api/
  redis:
    key-prefix: kotlin-skeleton:local
    ssl:
      disable-peer-verification-local: true
  redis-lock:
    startup-check:
      enabled: true                   # 기동 때 Redis 를 확인한다 (Redis 가 없으면 skeleton.redis-lock.enabled=false)
  auth:
    dev-login:
      enabled: ${DEV_LOGIN_ENABLED:true}
  web:
    cors:
      enabled: true
