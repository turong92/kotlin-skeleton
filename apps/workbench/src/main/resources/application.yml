# 워크벤치: 모듈 기본값과 다른 값만 적는다. 모듈별 키 전체와 기본값은 docs/config/modules/<module>.yml.
# 모듈은 기본값을 바꾸지 않는다 — 여기 적힌 값은 이 앱의 선택이다 (docs/minimal-composition.md).
spring:
  application:
    name: kotlin-skeleton
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}  # 시각 바인딩은 modules:db-postgresql (SqlDialect)
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    # 이 앱의 선택 (스켈레톤 모듈은 Flyway 기본값을 바꾸지 않는다 — docs/schema-management.md)
    locations: classpath:db/migration/{vendor}   # 앱 · 모듈 마이그레이션 합류 (모듈이 방언별 폴더를 쓰므로 필수)
    out-of-order: true                           # UTC 타임스탬프 버전 — 늦게 합쳐진 이른 시각 파일도 적용
    validate-migration-naming: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info

springdoc:
  # API 스펙 JSON: /api/v1/docs
  # Swagger UI: /api/v1/docs/ui
  api-docs:
    path: /api/v1/docs
  swagger-ui:
    path: /api/v1/docs/ui
    # 개발 환경에서만 노출하고 싶으면 disabled: ${SPRINGDOC_DISABLED:false}

logging:
  level:
    org.flywaydb.core.internal.database.base.Database: ERROR
    skeleton.debug.request: INFO
    skeleton.debug.external-http: INFO
    skeleton.debug.auth: INFO
    skeleton.debug.payment: INFO
    skeleton.debug.sql: OFF
    skeleton.debug.async: INFO
  pattern:
    correlation: "%clr(%X{traceContext:-}){faded} "

skeleton:
  config:
    validation:
      requirements:
        - property: skeleton.auth.jwt.secret
          env: JWT_SECRET
          ssm: /kotlin-skeleton/{profile}/skeleton.auth.jwt.secret
          profiles: [dev, staging, prod]
          allow-dummy-profiles: [local]
          secret: true
          description: JWT signing secret
        - property: spring.datasource.password
          env: SPRING_DATASOURCE_PASSWORD
          ssm: /kotlin-skeleton/{profile}/spring.datasource.password
          profiles: [dev, staging, prod]
          secret: true
          description: Database password
  # 환경변수 별칭 — Spring 의 느슨한 바인딩(SKELETON_AUTH_JWT_SECRET 등)으로는 닿지 않는 이름들. 값은 모듈 기본값 그대로다
  auth:
    jwt:
      issuer: ${JWT_ISSUER:kotlin-skeleton}
      secret: ${JWT_SECRET:dev-local-jwt-secret-change-me-32-bytes}   # prod · staging 에서 이 기본값이면 기동 실패 (auth 모듈 검증)
    dev-login:
      enabled: ${DEV_LOGIN_ENABLED:false}
    break-glass:
      enabled: ${BREAK_GLASS_ENABLED:false}
      secret: ${BREAK_GLASS_SECRET:}
      allowed-account-ids: ${BREAK_GLASS_ALLOWED_ACCOUNT_IDS:}
  # 워크벤치의 선택: 레이트 리밋 저장소는 인메모리 (Redis 없이 `skeleton.web.rate-limit.enabled=true` 를 시험한다). Redis 저장소는 true
  redis-rate-limit:
    enabled: false
    key-namespace: api           # 모듈 기본값은 default
  storage:
    validation:
      max-size-bytes: 10485760   # 모듈 기본값은 제한 없음
  event-kafka:
    topic-prefix: ""             # 환경 접두사 없이 토픽 이름 그대로 (모듈 기본값은 "<environment>.")
  notification-websocket:
    enabled: false               # 워크벤치의 선택: 켜면 알림 구독자가 하나 더 붙는다 (SKELETON_NOTIFICATION_WEBSOCKET_ENABLED=true). 모듈 기본값은 true
    endpoint:
      allowed-origin-patterns: http://localhost:[*],http://127.0.0.1:[*]   # 모듈 기본값은 "*"
  # 워크벤치 컨트롤러(SkeletonPaymentController)가 제공자 빈이 없을 때 이 설정으로 경로를 보여 준다
  payment:
    providers:
      toss:
        currencies: KRW
        countries: KR
  # 벤더 표준 환경변수 이름 별칭 (빈 값이면 제공자는 꺼진 채다 — enabled=true 로 켠다)
  payment-toss:
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
  payment-stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
