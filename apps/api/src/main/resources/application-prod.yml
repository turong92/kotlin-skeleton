spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}

skeleton:
  config:
    aws:
      ssm:
        region: ${AWS_REGION:ap-northeast-2}
        credential-profile: ${AWS_PROFILE:}
        fail-fast: ${SKELETON_CONFIG_AWS_SSM_FAIL_FAST:true}
        paths:
          - /kotlin-skeleton/prod/common/
          - /kotlin-skeleton/prod/api/
  redis:
    mode: standalone
    host: ${SKELETON_REDIS_HOST:localhost}
    port: ${SKELETON_REDIS_PORT:6379}
    username: ${SKELETON_REDIS_USERNAME:}
    password: ${SKELETON_REDIS_PASSWORD:}
    database: ${SKELETON_REDIS_DATABASE:0}
    ssl:
      enabled: ${SKELETON_REDIS_SSL_ENABLED:true}
      disable-peer-verification-local: ${SKELETON_REDIS_SSL_DISABLE_PEER_VERIFICATION_LOCAL:false}
    timeout:
      connect: ${SKELETON_REDIS_CONNECT_TIMEOUT:2s}
      command: ${SKELETON_REDIS_COMMAND_TIMEOUT:2s}
    key-prefix: ${SKELETON_REDIS_KEY_PREFIX:kotlin-skeleton:prod}
    json:
      trusted-packages: ${SKELETON_REDIS_JSON_TRUSTED_PACKAGES:dev.sumin.skeleton,java.time,java.util}
  auth:
    jwt:
      secret: ${JWT_SECRET:}
    dev-login:
      enabled: false
    break-glass:
      enabled: ${BREAK_GLASS_ENABLED:false}
      secret: ${BREAK_GLASS_SECRET:}
      allowed-account-ids: ${BREAK_GLASS_ALLOWED_ACCOUNT_IDS:}
