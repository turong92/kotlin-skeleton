# 스타터: 모듈 기본값과 다른 값만 적는다. 모듈은 기본값을 바꾸지 않는다 — 선택은 여기 명시한다 (docs/schema-management.md).
spring:
  application:
    name: kotlin-skeleton
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}  # 시각 바인딩은 modules:db-postgresql (SqlDialect)
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
  flyway:
    # 이 앱의 선택 (docs/schema-management.md)
    locations: classpath:db/migration/{vendor}   # 방언별 폴더 (db-postgresql ↔ postgresql). 모듈 마이그레이션이 늘어도 합류한다
    out-of-order: true                           # UTC 타임스탬프 버전 — 늦게 합쳐진 이른 시각 파일도 적용
    validate-migration-naming: true

# 컨테이너 헬스체크용 정직한 신호 — GET /health (인증 없이, 앱 + DB 가 떠 있을 때만 200 {"status":"UP"}, 아니면 503, 세부 정보 없음).
# 이 앱의 선택이다 (모듈 기본값이 아니다): 액추에이터 base-path 를 / 로 두고 health · info 만 연다. 나머지 액추에이터는 열지 않는다. docs/deploy.md §3
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info

# API 스펙 JSON: /api/v1/docs (springdoc 은 platform 이 가져온다. Swagger UI 가 필요하면 springdoc-openapi-starter-webmvc-ui 를 얹는다)
springdoc:
  api-docs:
    path: /api/v1/docs

skeleton:
  persistence-jdbc:
    startup-wait:                        # 이 앱의 선택(모듈 기본은 꺼짐): DB 컨테이너가 아직 초기화 중일 때 앱이 먼저 떠도 재시작 없이 붙는다 — docs/deploy.md §3
      enabled: true
      timeout: 60s                       # 안 되면 host:port 와 가능한 원인을 말하며 실패한다 (비밀번호는 말하지 않는다)
      interval: 2s
  web:
    client-ip:
      # 플랫폼이 넣는 이름 그대로 받는다 — 홈서버 infra/modules/app-docker/app.tf 는 `<PREFIX>_CLIENT_IP_MODE=cloudflare|proxy` 와
      # `<PREFIX>_CLIENT_IP_TRUSTED_PROXIES=<CIDR>[,<CIDR>…]` 를 준다 (`WEB_` 없음 · 소문자). 비우면 모드를 정하지 않은 것이고 stage · prod 의 계정 가드가 기동을 막는다.
      # 긴 이름(<PREFIX>_WEB_CLIENT_IP_MODE)도 Spring 의 느슨한 바인딩으로 그대로 먹는다. 로컬 프로필은 application-local.yml 에서 direct. docs/client-ip.md
      mode: ${SKELETON_CLIENT_IP_MODE:}
      trusted-proxies: ${SKELETON_CLIENT_IP_TRUSTED_PROXIES:}
  auth-session:
    reuse-grace: 10s                      # 이 앱의 선택: 응답을 잃은 브라우저(페이지 이동 중 refresh)의 재시도는 같은 후속 토큰을 받는다 — 세션이 죽지 않는다. 지나서 옛 토큰을 내밀면 탈취로 보고 세션을 닫는다 (docs/accounts.md)
  legal:
    reconsent:
      enabled: true                   # 이 앱의 선택: 필수 문서에 동의하지 않았거나 새 판이 나온 로그인 사용자의 호출은 403 LEGAL.RECONSENT_REQUIRED — 프런트가 동의 화면을 거친다 (모듈 기본은 꺼짐 — docs/legal.md). 소셜 · 매직 링크로 처음 만든 계정도 이것으로 동의를 거친다
  account:
    social:
      sign-up: true                   # 이 앱의 선택: 소셜 로그인이 계정을 만든다 (제공자 모듈을 얹을 때만 의미가 있다)
      merge-on-verified-email: true   # 이 앱의 선택: 제공자가 확인한 같은 이메일이면 기존 계정에 연결 + 알림 메일 (모듈 기본은 병합 없이 409 — docs/accounts.md)
  auth:
    jwt:
      # 벤더 중립 환경변수 별칭 — 배포 선언의 secrets: [JWT_SECRET] 이 여기로 들어온다 (SKELETON_AUTH_JWT_SECRET 도 그대로 먹는다). 기본값은 개발용이라 prod · staging · SKELETON_ENV=stage|prod 에서는 기동 실패
      secret: ${JWT_SECRET:dev-local-jwt-secret-change-me-32-bytes}


# 운영에서는 환경변수로 바꾼다: skeleton.auth.jwt.secret ← JWT_SECRET (또는 SKELETON_AUTH_JWT_SECRET), spring.datasource.* ← SPRING_DATASOURCE_*
# 계정 메일 링크가 여는 프론트 주소: skeleton.account.mail.link-base-url ← <PREFIX>_ACCOUNT_MAIL_LINK_BASE_URL (비면 stage · prod 에서 기동 실패 — docs/accounts.md)
# 배포 환경 스위치: SKELETON_ENV=local|stage|prod (비우면 스위치 없음 — 프로필만 본다). docs/deploy.md
# prod · staging 프로필은 기본 JWT 비밀(32바이트 미만 · 내장 기본값 · 빈 값)과 내장 시드 계정(user/password)으로 뜨지 않는다 —
# 비밀을 정하고 AuthAccountRepository 빈을 둔다 (README "Protected profiles")
# 클라이언트 IP (로그인 · 가입 · 재설정 · 매직 링크의 IP 한도 키): skeleton.web.client-ip.mode 의 **값은 배포가 정한다** — 앞에 무엇이 있는지는 배포가 안다. 위 `web.client-ip` 는 플랫폼이 넣는 이름(SKELETON_CLIENT_IP_MODE · _TRUSTED_PROXIES)의 별칭만 두고 기본은 비어 있다.
# 로컬 프로필은 direct 로 명시한다(application-local.yml). 프록시 뒤 배포는 <PREFIX>_WEB_CLIENT_IP_MODE=proxy|cloudflare 와 <PREFIX>_WEB_CLIENT_IP_TRUSTED_PROXIES=<프록시 CIDR> 를 넣는다 — docs/client-ip.md · docs/deploy.md.
# stage · prod 에서 정하지 않으면 계정 가드가 기동을 막는다 (X-Forwarded-For 로 IP 한도를 우회할 수 있다).
