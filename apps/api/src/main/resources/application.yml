spring:
  application:
    name: kotlin-skeleton
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/app?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info

springdoc:
  # API 스펙 JSON: /api/v1/docs
  # Swagger UI: /api/v1/docs/ui
  api-docs:
    path: /api/v1/docs
  swagger-ui:
    path: /api/v1/docs/ui
    # 개발 환경에서만 노출하고 싶으면 disabled: ${SPRINGDOC_DISABLED:false}

logging:
  level:
    org.flywaydb.core.internal.database.base.Database: ERROR
  pattern:
    correlation: "%clr(%X{traceContext:-}){faded} "

skeleton:
  config:
    validation:
      enabled: true
      fail-fast: true
      requirements:
        - property: skeleton.auth.jwt.secret
          env: JWT_SECRET
          ssm: /kotlin-skeleton/{profile}/skeleton.auth.jwt.secret
          profiles: [dev, staging, prod]
          allow-dummy-profiles: [local]
          secret: true
          description: JWT signing secret
        - property: spring.datasource.password
          env: SPRING_DATASOURCE_PASSWORD
          ssm: /kotlin-skeleton/{profile}/spring.datasource.password
          profiles: [dev, staging, prod]
          secret: true
          description: Database password
  auth:
    jwt:
      issuer: ${JWT_ISSUER:kotlin-skeleton}
      secret: ${JWT_SECRET:dev-local-jwt-secret-change-me-32-bytes}
