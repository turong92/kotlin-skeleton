# 스타터: 모듈 기본값과 다른 값만 적는다. 모듈은 기본값을 바꾸지 않는다 — 선택은 여기 명시한다 (docs/schema-management.md).
spring:
  application:
    name: kotlin-skeleton
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}  # 시각 바인딩은 modules:db-postgresql (SqlDialect)
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
  flyway:
    # 이 앱의 선택 (docs/schema-management.md)
    locations: classpath:db/migration/{vendor}   # 방언별 폴더 (db-postgresql ↔ postgresql). 모듈 마이그레이션이 늘어도 합류한다
    out-of-order: true                           # UTC 타임스탬프 버전 — 늦게 합쳐진 이른 시각 파일도 적용
    validate-migration-naming: true

# API 스펙 JSON: /api/v1/docs (springdoc 은 platform 이 가져온다. Swagger UI 가 필요하면 springdoc-openapi-starter-webmvc-ui 를 얹는다)
springdoc:
  api-docs:
    path: /api/v1/docs

# 운영에서는 환경변수로 바꾼다: skeleton.auth.jwt.secret ← SKELETON_AUTH_JWT_SECRET, spring.datasource.* ← SPRING_DATASOURCE_*
# prod · staging 프로필은 기본 JWT 비밀(32바이트 미만 · 내장 기본값 · 빈 값)과 내장 시드 계정(user/password)으로 뜨지 않는다 —
# 비밀을 정하고 AuthAccountRepository 빈을 둔다 (README "Protected profiles")
