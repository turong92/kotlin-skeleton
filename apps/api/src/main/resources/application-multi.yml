# 견본: 한 프로세스에 프로젝트 둘 — `--spring.profiles.active=local,multi` (docs/multi-project.md).
# 브라우저 · curl 이 *.localhost 를 127.0.0.1 로 보내므로 hosts 파일이 필요 없다:  curl http://a.localhost:8080/api/v1/project-hello
# 먼저 scripts/dev-multi.sh 가 계정 · 스키마를 만들고 띄운다 (직접 띄우려면 scripts/project-account.sql).
# 프로젝트마다 스키마(proj_a · proj_b — `public` 은 건드리지 않는다)와 자기 로그인 설정을 가진다. 아래 비밀은 개발용이다.
skeleton:
  web:
    cors:
      enabled: true                     # 프런트 개발 서버(Vite)가 *.localhost:5173 에서 부른다 — 출처는 프로젝트마다 config 에서 정한다
  projects:
    a:
      hosts: [a.localhost]
      schema: proj_a
      datasource: { username: proj_a, password: proj_a_dev_pw }   # 프로젝트마다 DB 계정이 필수 — scripts/dev-multi.sh 가 계정 · 스키마를 만든다
      # 프로젝트마다 갈리는 설정의 전체 목록과 필수 값은 docs/multi-project.md. 모듈을 얹으면 같은 config 아래에 그 키를 적는다 (스타터는 로그인 쪽만 쓴다):
      #   auth-social.providers.google: { enabled: true, client-id: ..., client-secret: ${A_GOOGLE_SECRET}, redirect-uri: https://a.example.com/auth/callback/google }
      #   auth-social-x / auth-social-oidc.providers.<코드>: { client-id: ..., client-secret: ... }       # 켜는 스위치는 client-id
      #   notification-mail: { from: "Project A <no-reply@a.example.com>" }                              # 프로젝트마다 필수 (공통 값으로 내려가지 않는다)
      #   storage-s3: { bucket: shared-bucket, key-prefix: a }   # 버킷을 나눠 쓰면 key-prefix 가 서로 달라야 한다. 공개 URL 은 RAW, crypto 가 있으면 OPAQUE 도
      #   storage.web: { key-prefix: uploads, key-owner: OPAQUE, key-secret: ${A_STORAGE_KEY_SECRET} }  # OPAQUE 비밀은 프로젝트마다 달라야 한다
      #   legal: { location: file:/etc/app/legal-a/, facts: { company-name: Project A, contact-email: help@a.example.com } }
      #   captcha-turnstile: { secret-key: ${A_TURNSTILE_SECRET}, expected-hostname: a.example.com }
      #   crypto: { primary-key-id: a1, keys: { a1: ${A_CRYPTO_KEY} } }                                   # 프로젝트마다 다른 키 바이트(같으면 기동 실패). base64 AES 키
      #   payment-toss: { enabled: true, secret-key: ${A_TOSS_SECRET}, client-key: ${A_TOSS_CLIENT} }    # 결제사 키는 프로젝트마다 — B 가 안 켠 결제사는 B 의 결제 화면에 없다
      #   payment-kakaopay: { enabled: true, secret-key: ${A_KAKAOPAY_SECRET}, cid: ${A_KAKAOPAY_CID}, return-url: https://a.example.com/payments/return }   # 토스 계약 없이 카카오페이만 — 시크릿 키 · 가맹점 코드 · 돌아올 주소 모두 프로젝트마다
      #   payment-naverpay: { enabled: true, mode: production, client-id: ${A_NAVERPAY_CLIENT_ID}, client-secret: ${A_NAVERPAY_SECRET}, chain-id: ${A_NAVERPAY_CHAIN_ID}, return-url: https://a.example.com/payments/return }   # 토스 계약 없이 네이버페이만 — 아이디 · 시크릿 · 체인 아이디 · 돌아올 주소 모두 프로젝트마다
      #   payment-paddle: { enabled: true, api-key: ${A_PADDLE_API}, client-token: ..., webhook-secret: ${A_PADDLE_WEBHOOK} }
      #   payment: { default-provider: toss, routing: { country-providers: { KR: toss, US: paddle } }, webhook: { path-token: ${A_PAYMENT_WEBHOOK_TOKEN} } }  # 비밀 조각 24자+ (서명 없는 결제사의 웹훅 주소)
      config:
        auth:
          jwt: { secret: dev-only-jwt-secret-of-project-a-32+bytes, issuer: project-a }
        auth-session:
          cookie: { name: a_refresh }
        web:
          cors: { allowed-origin-patterns: ["http://a.localhost:[*]"], allow-credentials: true }
        account:
          mail:
            link-base-url: http://a.localhost:5173
            brand: { service-name: Project A }
          seed:
            accounts:
              - { id: acc_a_user, email: user@a.localhost, password: password }
    b:
      hosts: [b.localhost]
      schema: proj_b
      datasource: { username: proj_b, password: proj_b_dev_pw }
      config:
        auth:
          jwt: { secret: dev-only-jwt-secret-of-project-b-32+bytes, issuer: project-b }
        auth-session:
          cookie: { name: b_refresh }
        web:
          cors: { allowed-origin-patterns: ["http://b.localhost:[*]"], allow-credentials: true }
        account:
          mail:
            link-base-url: http://b.localhost:5173
            brand: { service-name: Project B }
          seed:
            accounts:
              - { id: acc_b_user, email: user@b.localhost, password: password }
