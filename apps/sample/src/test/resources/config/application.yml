# 컨텍스트 여럿이 한 컨테이너를 나눠 쓴다(TestcontainersConfiguration) — 캐시에 살아 있는 컨텍스트마다 풀이 놀고 있는 연결을 들고 있지 않게 한다.
# classpath:/config/ 라서 main 의 application.yml 을 가리지 않고 합쳐진다.
spring:
  datasource:
    hikari:
      minimum-idle: 1
skeleton:
  persistence-jdbc:
    startup-wait:
      enabled: false   # 시험의 연결은 TestcontainersConfiguration 의 JdbcConnectionDetails 가 정한다 — main 의 기본 URL(localhost:5432)을 기다리지 않는다
  legal:
    reconsent:
      enabled: false   # notes · board 시험은 시드 계정으로 보호된 엔드포인트를 부른다 — 동의는 이 시험들의 주제가 아니다. 재동의 흐름은 LegalJourneyIntegrationTest 가 켜서 시험한다
