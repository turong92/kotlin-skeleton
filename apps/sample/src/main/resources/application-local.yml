# 로컬 프로필: compose 의 S3(SeaweedFS, profile s3 — scripts/dev.sh 가 올린다)에 붙는다. 서버와 브라우저가 같은 주소(localhost:S3_PORT)다.
spring:
  mail:                                   # compose 의 mail 프로필(mailpit): SMTP localhost:1025, 받은 메일 http://localhost:8025
    host: localhost
    port: ${MAIL_SMTP_PORT:1025}
skeleton:
  web:
    client-ip:
      mode: direct                           # 로컬은 앞에 프록시가 없다 — 헤더를 믿지 않고 소켓 주소가 클라이언트 (docs/client-ip.md)
  notification-mail:
    enabled: true
    from: "Notes <no-reply@notes.local>"
  account:
    mail:
      link-base-url: http://localhost:5173   # react-skeleton 개발 서버 (apps/sample)
    sign-up:
      per-ip: 500                            # 로컬은 모두가 같은 IP(localhost)다 — 가입 화면을 여러 번 시험해도 429 가 나지 않게 (모듈 기본 10/h)
    verification:
      per-ip: 500
      attempts-per-ip: 500
    login:
      per-account: 200                       # e2e(Playwright)가 같은 시드 계정으로 자주 로그인한다 — 로컬에서만 한도를 넉넉히
      per-ip: 500
    seed:
      accounts:                              # 로컬 · e2e 시드 — 고정 id 로 픽스처 · 업로드 키가 안정된다. 비밀번호는 모두 password
        - { id: acc_user, email: user@example.com, password: password, display-name: User }
        - { id: acc_admin, email: admin@example.com, password: password, roles: [ADMIN], display-name: Admin }
        - { id: acc_moderator, email: moderator@example.com, password: password, roles: [MODERATOR], display-name: Moderator }
  legal:
    reconsent:
      enabled: false                    # 로컬 전용: 시드 계정은 가입 화면을 거치지 않아 동의 기록이 없다 — 켜 둔 채로는 e2e(Playwright)가 403 이다. 동의 흐름을 시험하려면 true (docs/legal.md)
  migration:
    clean-on-validation-error: false  # 동결된 마이그레이션(migrations.lock)은 로컬에서도 조용히 DB 를 지우지 않는다 — 검증 오류면 기동이 실패한다. 정말 버릴 로컬 DB 만: SKELETON_MIGRATION_CLEAN_ON_VALIDATION_ERROR=true (docs/schema-management.md)
  storage-s3:
    bucket: app
    region: us-east-1
    endpoint-override: http://localhost:${S3_PORT:8333}
    path-style-access-enabled: true
    credentials:
      access-key-id: dev
      secret-access-key: dev-secret
