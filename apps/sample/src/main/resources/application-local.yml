# 로컬 프로필: compose 의 S3(SeaweedFS, profile s3 — scripts/dev.sh 가 올린다)에 붙는다. 서버와 브라우저가 같은 주소(localhost:S3_PORT)다.
spring:
  mail:                                   # compose 의 mail 프로필(mailpit): SMTP localhost:1025, 받은 메일 http://localhost:8025
    host: localhost
    port: ${MAIL_SMTP_PORT:1025}
skeleton:
  web:
    client-ip:
      mode: direct                           # 로컬은 앞에 프록시가 없다 — 헤더를 믿지 않고 소켓 주소가 클라이언트 (docs/client-ip.md)
  notification-mail:
    enabled: true
    from: "Notes <no-reply@notes.local>"
  account:
    mail:
      link-base-url: http://localhost:5173   # react-skeleton 개발 서버 (apps/sample)
    sign-up:
      per-ip: 500                            # 로컬은 모두가 같은 IP(localhost)다 — 가입 화면을 여러 번 시험해도 429 가 나지 않게 (모듈 기본 10/h)
    verification:
      per-ip: 500
      attempts-per-ip: 500
    login:
      per-account: 200                       # e2e(Playwright)가 같은 시드 계정으로 자주 로그인한다 — 로컬에서만 한도를 넉넉히
      per-ip: 500
    login-id:
      claim-limit: 500                       # 로컬은 모두가 같은 IP(localhost)다 — 소셜 계정을 열 개 넘게 만들며 손으로 확인(dev-sample.sh)해도 아이디 정하기가 429 가 나지 않게 (모듈 기본 10/h)
      check-per-ip: 500                      # 실시간 중복 확인도 같은 IP 한도를 쓴다 (모듈 기본 30/10m)
    seed:
      accounts:                              # 로컬 · e2e 시드 — 고정 id 로 픽스처 · 업로드 키가 안정된다. 비밀번호는 모두 password
        - { id: acc_user, email: user@example.com, password: password, display-name: User, login-id: sample-user }
        - { id: acc_admin, email: admin@example.com, password: password, roles: [ADMIN], display-name: Admin, login-id: sample-admin }
        - { id: acc_moderator, email: moderator@example.com, password: password, roles: [MODERATOR], display-name: Moderator, login-id: sample-moderator }
  crypto:
    primary-key-id: local
    keys:
      local: bG9jYWwtZGV2LW9ubHktY3J5cHRvLWtleS0wMTIzNDU=   # 로컬 · e2e 전용 고정 값 — 빌링키를 암호화한다. 운영 값은 환경변수 SKELETON_CRYPTO_KEYS_MAIN
  sample:
    subscription:
      period: PT3M                       # 로컬: 갱신 · 재시도 · 종료를 몇 분 안에 눌러 본다 (기본 P1M)
  payment:
    routing:
      dev-country-switch: true           # 로컬 전용: 요청의 X-Dev-Country 헤더로 나라를 오간다(견본 화면의 「개발용 나라」 고르기) - 보호 환경에서 켜면 기동 실패
    # 로컬 나라: client-ip 가 direct 라 CF-IPCountry 는 읽지 않는다 → 기본 나라 KR(토스 + 한국 정책). 다른 나라 화면(Paddle)은 SKELETON_PAYMENT_ROUTING_DEV_COUNTRY=US (아래 routing.dev-country 의 환경변수 이름). Cloudflare 터널(skel.example.com) 뒤라면 SKELETON_WEB_CLIENT_IP_MODE=cloudflare + SKELETON_WEB_CLIENT_IP_TRUSTED_PROXIES=127.0.0.1/32,::1/128 로 실제 접속 나라를 쓴다.
    subscription:
      enabled: ${skeleton.payment-toss.enabled:${skeleton.payment-paddle.enabled:false}}   # 토스나 Paddle 을 켰을 때만 구독도 켠다 — 키 없이 뜨는 로컬은 예전처럼 결제 화면이 「지금은 결제할 수 없어요」다
      renewal:
        retry-interval: 1m               # 로컬: 갱신이 거절되면 1분 뒤 다시 (기본 24시간), 세 번 거절되면 구독이 끝난다
    admin:
      enabled: true                      # 로컬 · e2e: 운영자 화면(/admin/payments)이 쓰는 경로를 연다 — 시드 admin@example.com 이 ADMIN. 배포는 SKELETON_PAYMENT_ADMIN_ENABLED
    http:
      order-rate-limit:                  # 로컬은 모두가 같은 IP(localhost)이고 e2e 가 한 계정으로 주문을 여럿 만든다 — 한도를 넉넉히 (모듈 기본 계정 10 · IP 30 / 10분)
        account-capacity: 500
        ip-capacity: 2000
  legal:
    reconsent:
      enabled: false                    # 로컬 전용: 시드 계정은 가입 화면을 거치지 않아 동의 기록이 없다 — 켜 둔 채로는 e2e(Playwright)가 403 이다. 동의 흐름을 시험하려면 true (docs/legal.md)
  migration:
    clean-on-validation-error: false  # 동결된 마이그레이션(migrations.lock)은 로컬에서도 조용히 DB 를 지우지 않는다 — 검증 오류면 기동이 실패한다. 정말 버릴 로컬 DB 만: SKELETON_MIGRATION_CLEAN_ON_VALIDATION_ERROR=true (docs/schema-management.md)
  storage:
    web:
      key-secret: local-dev-only-storage-key-secret-0123456789   # 로컬 · e2e 전용 고정 값(32자 이상) — OPAQUE 첨부 키의 HMAC. 운영 값은 환경변수 SKELETON_STORAGE_WEB_KEY_SECRET (docs/deploy.md §7)
  storage-s3:
    bucket: app
    region: us-east-1
    endpoint-override: http://localhost:${S3_PORT:8333}
    path-style-access-enabled: true
    credentials:
      access-key-id: dev
      secret-access-key: dev-secret
