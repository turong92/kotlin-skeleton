# 샘플 앱 "Notes": 모듈 기본값과 다른 값만 적는다 — 모듈은 기본값을 바꾸지 않고, 선택은 여기서 한다 (docs/sample.md).
spring:
  application:
    name: kotlin-skeleton
  aot:
    repositories:
      enabled: false   # 네이티브 빌드 전용: Spring Data 의 저장소 AOT 생성은 빌드 때 DB 에 연결해 방언을 알아내려 한다(빌드에는 DB 가 없다) - 끄면 저장소 프록시가 실행 때 만들어진다 (docs/native-image.md). JVM 실행에는 영향 없다
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/app}  # 시각 바인딩은 modules:db-postgresql (SqlDialect)
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
  flyway:
    # 이 앱의 선택 (docs/schema-management.md)
    locations: classpath:db/migration/{vendor}   # 방언별 폴더. 모듈(job-queue-jdbc · notification-jdbc) 마이그레이션이 합류한다
    out-of-order: true                           # UTC 타임스탬프 버전 — 늦게 합쳐진 이른 시각 파일도 적용
    validate-migration-naming: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      base-path: /          # GET /health (platform 이 공개 경로로 연다)
      exposure:
        include: health, info
  health:
    mail:
      enabled: false      # /health 는 앱 + DB 가 떠 있을 때만 200 — SMTP 릴레이가 죽었다고 컨테이너를 unhealthy 로 만들지 않는다 (docs/deploy.md §3)

springdoc:
  api-docs:
    path: /api/v1/docs

skeleton:
  persistence-jdbc:
    startup-wait:                        # 이 앱의 선택(모듈 기본은 꺼짐): DB 컨테이너가 아직 초기화 중일 때 앱이 먼저 떠도 재시작 없이 붙는다 — docs/deploy.md §3
      enabled: true
      timeout: 60s                       # 안 되면 host:port 와 가능한 원인을 말하며 실패한다 (비밀번호는 말하지 않는다)
      interval: 2s
  web:
    client-ip:
      # 플랫폼이 넣는 이름 그대로 받는다 — 홈서버 infra/modules/app-docker/app.tf 는 `<PREFIX>_CLIENT_IP_MODE=cloudflare|proxy` 와
      # `<PREFIX>_CLIENT_IP_TRUSTED_PROXIES=<CIDR>[,<CIDR>…]` 를 준다 (`WEB_` 없음 · 소문자). 비우면 모드를 정하지 않은 것이고 stage · prod 의 계정 가드가 기동을 막는다.
      # 긴 이름(<PREFIX>_WEB_CLIENT_IP_MODE)도 Spring 의 느슨한 바인딩으로 그대로 먹는다. 로컬 프로필은 application-local.yml 에서 direct. docs/client-ip.md
      mode: ${SKELETON_CLIENT_IP_MODE:}
      trusted-proxies: ${SKELETON_CLIENT_IP_TRUSTED_PROXIES:}
  auth-session:
    reuse-grace: 10s                      # 이 앱의 선택: 응답을 잃은 브라우저(페이지 이동 중 refresh)의 재시도는 같은 후속 토큰을 받는다 — 세션이 죽지 않는다. 지나서 옛 토큰을 내밀면 탈취로 보고 세션을 닫는다 (docs/accounts.md)
  auth:
    jwt:
      secret: ${JWT_SECRET:dev-local-jwt-secret-change-me-32-bytes}   # 배포 선언의 secrets: [JWT_SECRET] 별칭. 기본값(개발용)으로는 prod · staging · SKELETON_ENV=stage|prod 에서 기동 실패 (docs/deploy.md)
  legal:
    # 문서는 이 앱의 src/main/resources/legal/ (기본 위치 classpath:legal/) — manifest.json 이 종류 · 판 · 시행일 · 상태를 정한다
    required: [terms, privacy]        # 이 앱의 선택(= 모듈 기본): 서비스를 쓰려면 이 둘의 현재 판에 동의해야 한다. marketing 은 선택이다 — 가입 때 체크하면 기록되고 설정에서 거둘 수 있다
    previous-version-grace: 7d        # 이 앱의 선택(모듈 기본 0): 새 판이 나온 뒤 7 일은 앞 판 동의도 받아 준다 — 배포 사이에 열려 있던 화면이 거절당하지 않게 · 새 판 안내 기간
    facts:                            # 문서의 {{키}} 자리표시를 채운다 — prod 전에 실제 값으로 (DeployGuard 가 TEMPLATE 이 아닌 문서의 빈 자리표시를 막는다)
      company-name: Notes Sample
      contact-email: help@notes.example
    reconsent:
      enabled: true                   # 이 앱의 선택: 필수 문서에 동의하지 않았거나 새 판이 나온 로그인 사용자의 호출은 403 LEGAL.RECONSENT_REQUIRED — 소셜 · 매직 링크로 처음 만든 계정도 이것으로 동의를 거친다
  account:
    social:
      sign-up: true                       # 이 앱의 선택: 소셜 로그인이 계정을 만든다 (제공자 모듈을 얹을 때만 의미가 있다)
      import-display-name: false         # 이 앱의 선택: 제공자가 준 이름(Google 실명 · Kakao 닉네임 …)을 닉네임으로 가져오지 않는다 — 소셜 가입 직후는 이름 없음(display-name.fallback: NONE)이고 프런트가 「닉네임 정하기」를 받는다
      # merge-on-verified-email: 켜려면 true — 같은 이메일의 소셜 로그인이 기존 계정에 자동 연결된다(위험·조건은 docs/accounts.md). 이 앱은 끈다: 409 ACCOUNT.SOCIAL_EMAIL_CONFLICT → 기존 방법으로 로그인해 설정에서 직접 연결
    mail:
      brand:
        service-name: Notes                # 메일 머리글 · 바닥글 이름. 로고 · 색 · 문의 주소 · 바닥글은 같은 접두사의 logo-url · accent-color · support-address · footer (docs/modules/account.md)
      default-locale: ko                  # 계정 로케일이 없을 때 메일 언어. 링크가 여는 프론트 주소는 환경변수 <PREFIX>_ACCOUNT_MAIL_LINK_BASE_URL (비면 stage · prod 에서 기동 실패)
    admin:
      enabled: true                       # 운영자 계정 도구(/api/v1/admin/accounts) — 이 앱의 선택. ADMIN 역할이 필요하다
    display-name:                         # 게시판에 보이는 닉네임 — 이 앱의 선택들 (모듈 기본은 중복 허용 · 선택 · 자동 닉네임 없음 — docs/accounts.md "닉네임")
      uniqueness: TAGGED                  # 같은 닉네임이어도 되고 서버가 4자리 꼬리표를 붙인다 (닉네임#0417). 바꾸면 꼬리표를 새로 뽑는다
      required-on-sign-up: true           # 이메일 가입에는 닉네임이 필요하다 (400 · 필드 displayName). 소셜 · 매직 링크 가입은 아래 자동 닉네임이 채운다
      fallback: NONE                      # 닉네임 없이 만들어지는 계정(매직 링크 가입 · 이름을 안 주는 제공자)은 이름 없이 두고 프론트가 「닉네임 정하기」로 받는다. 자동 닉네임(user-1a2b3c)을 주려면 GENERATED
    contact-email:
      enabled: true                       # 이 앱의 선택: 계정 이메일과 별개로 서비스 안내를 받을 주소를 하나 등록할 수 있다 (로그인 · 계정 복구 수단은 아니다 — docs/accounts.md "연락 이메일")
    email:
      required: true                      # 이 앱의 선택: 이메일 없이 만들어진 계정(Kakao · Naver · X · LINE · 이메일 동의를 안 한 소셜)은 주소를 등록하기 전까지 403 ACCOUNT.EMAIL_REQUIRED (docs/accounts.md "이메일 필수")
      required-when: WRITE                # 이 앱의 선택: 읽기는 이메일 없이, 쓰려 할 때 받는다 (모듈 기본은 SIGN_IN = 로그인 직후부터 막는다). 오래된 세션의 첫 등록은 제공자 재확인 — 새 세션은 재인증 없이
      extra-exclude-paths:                # 이메일 없이도 되는 사소한 쓰기 · 읽기처럼 보이는 POST — 기본은 막힘이라 여기 적은 것만 열린다 (WriteGateCensusTest 가 목록을 고정한다. 결제 경로는 절대 적지 않는다)
        - PATCH /api/v1/notifications/*/read   # 알림함을 여는 것은 읽기인데 화면이 읽음 표시를 보낸다
        - PATCH /api/v1/notifications/read-all
        - PUT /api/v1/notifications/preferences/*   # 알림 끄기는 자기 설정일 뿐 남에게 영향이 없다 - 이메일 없는 계정도 끌 수 있어야 한다
        - POST /api/v1/storage/presign-download  # 글의 첨부를 보려면 필요하다 — 읽기처럼 보이는 POST
    login-id:
      enabled: true                       # 이 앱의 선택: 이메일이 바뀌어도 안 바뀌는 로그인 아이디 — 가입 때 받고, 소셜 첫 로그인 · 아이디 없는 기존 계정은 403 ACCOUNT.LOGIN_ID_REQUIRED 로 정하게 한다 (docs/accounts.md). 서버 비밀 <PREFIX>_ACCOUNT_BLOCKS_SECRET 이 stage · prod 에서 필요하다
      reserved: [admin, administrator, root, system, support, help, staff, moderator, notes]   # 내줄 수 없는 아이디 — 기호와 대소문자를 빼고 비교. 로컬 시드 계정은 예외
    deletion:
      self-restore: true                  # 이 앱의 선택: 탈퇴 유예 중인 주인이 로그인하면 403 AUTH.ACCOUNT_DELETION_PENDING + 취소 토큰으로 스스로 탈퇴를 취소한다 (모듈 기본은 꺼짐 — 운영자만 복구, docs/accounts.md)
  auth-magic-link:
    sign-up: true                         # 메일함을 증명하면 가입까지 끝나는 앱 — 이 앱의 선택 (모듈 기본은 이미 있는 계정으로만)
  # 글로벌 소셜 로그인 (google · LINE · X): client id 를 환경변수로 줄 때만 GET /auth/methods 에 나타난다 — 비어 있으면 아무것도 바뀌지 않는다.
  #   LINE: <PREFIX>_AUTH_SOCIAL_OIDC_PROVIDERS_LINE_CLIENT_ID / _CLIENT_SECRET   X: <PREFIX>_AUTH_SOCIAL_X_CLIENT_ID / _CLIENT_SECRET   (docs/modules/auth-social-oidc.md · auth-social-x.md)
  job-queue:
    poll-interval: 1s                 # 내보내기가 몇 초 안에 끝나 보이도록 (모듈 기본값은 2s)
    concurrency: 4                    # 일꾼 스레드 넷 - 웹훅 · 지급 · 메일이 서로 기다리지 않게 (모듈 기본은 1)
    retention:
      enabled: true                   # 끝난 작업 줄이 쌓이지 않게 (모듈 기본은 꺼짐 — 보관 정책은 앱이 정한다)
  alert:
    webhook-url: ${ALERT_WEBHOOK_URL:}  # 비우면 꺼진다 — 주소(Discord 웹훅)가 있을 때만 5xx 몰림 · 죽은 작업 · 기동 실패를 알린다 (docs/alert.md)
  storage:
    web:
      key-owner: OPAQUE                 # 이 앱의 선택: 첨부 키에 계정 id 가 없다 — 작성자 프로필(author-profile)이 글 · 댓글 첨부 키로 두 프로필을 잇지 못하게 (모듈 기본은 ACCOUNT_ID). 키 모양 · 파일 이름 규칙: docs/modules/storage.md
      # key-secret(OPAQUE 키의 HMAC 비밀, 32자 이상)은 여기 쓰지 않는다 — 환경변수 SKELETON_STORAGE_WEB_KEY_SECRET (선언의 secrets: · deploy/app.yaml 의 [storage] 줄 · docs/deploy.md §7).
      # 비었거나 짧으면 기동 실패. 로컬 · e2e 는 application-local.yml, 시험은 test config/application.yml 이 고정 더미 값을 둔다
      guest:
        enabled: true                   # 이 앱의 선택: 로그인하지 않은 사람도 이미지(jpeg · png · webp · gif, SVG 불가, 10 MB)를 올려 비회원 댓글 사진으로 쓴다 - POST /api/v1/storage/guest/presign 하나만 익명에 열린다. 비밀(키 MAC, 32자 이상)은 환경변수 SKELETON_STORAGE_WEB_GUEST_SECRET (선언의 secrets:). 모듈 기본은 꺼짐 - docs/modules/storage.md
        # 캡차는 끈 채(captcha: OFF)다 - 견본에는 Turnstile 키가 없다. **공개 서비스에서는 board 의 guest.captcha 와 함께 REQUIRED 로 켠다**(익명 스토리지 쓰기이므로 스팸 위험이 같다)
        cleanup:
          enabled: true                 # 24시간 안에 글 · 댓글에 붙지 않은 비회원 업로드를 한 시간마다 지운다(scheduler 모듈 필요 - 위 build.gradle.kts)
      public:
        enabled: true                   # 이 앱의 선택: 공개된 글 · 댓글의 사진은 공개 주소(CDN)로, 승인 전 · 거절 · 가림 · 판의 사진은 비공개로 둔다 - 승인하면 공개 영역으로 복사하고 가리면 지운다 (docs/modules/storage.md "게시판 사진의 공개 영역"). 모듈 기본은 꺼짐
        base-url: ${SKELETON_STORAGE_WEB_PUBLIC_BASE_URL:}   # 공개 영역 앞의 주소(CDN 또는 공개 읽기 버킷). 비밀이 아니다 - 비면 기동 실패. 로컬은 application-local.yml. 비밀(공개 키 HMAC)은 환경변수 SKELETON_STORAGE_WEB_PUBLIC_SECRET (선언의 secrets:)
    validation:                       # 첨부 규칙 — 서버가 presign 전에 검사한다 (프론트도 같은 규칙을 미리 보여 준다)
      max-size-bytes: 5242880         # 5 MB
      allowed-content-types: [image/png, image/jpeg, image/gif, image/webp, application/pdf, text/plain]
      allowed-extensions: [png, jpg, jpeg, gif, webp, pdf, txt]
  # author-profile(build.gradle.kts 의 두 줄): 이 앱은 모듈 기본 그대로 쓴다 — 계정당 5개 · adopt-on-startup 켜짐 · 이름 규칙은 위 account.display-name (docs/modules/author-profile.md)
  board:
    reaction:
      types: [LIKE, DISLIKE, EMPATHY]   # 이 앱이 더한 종류 — 모듈 기본은 [LIKE, DISLIKE]. 코드 · 스키마 변경 없이 여기에만 적는다
    comment-max-attachments: 4          # 댓글 사진(저장 키) 4장까지 — 기본은 0(꺼짐). 업로드는 앱(storage - 로그인한 사람은 자기 업로드, 비회원은 storage.web.guest 의 비회원 업로드)
    http:
      allow-anonymous-read: true        # 비회원이 읽는다 - 로그인 없이 쓰는 비회원 글 · 댓글(아래 guest)을 시연하려면 읽기가 열려 있어야 한다
    guest:
      enabled: true                     # 로그인하지 않은 사람의 글 · 댓글(닉네임 + 비밀번호). 게시판의 settings.guestWrite 가 실제로 정한다
      # 캡차는 끈 채(captcha: OFF)다 - 견본에는 Turnstile 키가 없다. **공개 서비스에서 비회원 쓰기를 켤 때는 캡차를 함께 켠다**(스팸 위험):
      #   skeleton.captcha-turnstile.enabled=true + secret-key, 그리고 captcha: REQUIRED (docs/modules/board.md 의 경고와 예시)
    seed-boards:                        # 기동할 때 없으면 만드는 게시판 (설정은 만들 때만 적용된다 - 있는 DB 의 general 은 견본 마이그레이션이 켠다)
      - code: general
        name: General
        description: 자유 게시판
        settings:
          guest-write: ALL              # 비회원이 글 · 댓글을 쓴다
          post-approval: GUESTS         # 비회원의 새 글은 운영자 승인 뒤에 공개 (회원은 바로)
          comment-approval: GUESTS      # 비회원의 새 댓글은 글 주인 · 운영자 승인 뒤에 공개
          owner-moderates-comments: true  # 글 주인이 자기 글의 댓글을 승인 · 가린다
# 클라이언트 IP (로그인 · 가입 · 재설정 · 매직 링크의 IP 한도 키): skeleton.web.client-ip.mode 의 **값은 배포가 정한다** — 앞에 무엇이 있는지는 배포가 안다. 위 `web.client-ip` 는 플랫폼이 넣는 이름(SKELETON_CLIENT_IP_MODE · _TRUSTED_PROXIES)의 별칭만 두고 기본은 비어 있다.
# 로컬 프로필은 direct 로 명시한다(application-local.yml). 프록시 뒤 배포는 <PREFIX>_WEB_CLIENT_IP_MODE=proxy|cloudflare 와 <PREFIX>_WEB_CLIENT_IP_TRUSTED_PROXIES=<프록시 CIDR> 를 넣는다 — docs/client-ip.md · docs/deploy.md.
# stage · prod 에서 정하지 않으면 계정 가드가 기동을 막는다 (X-Forwarded-For 로 IP 한도를 우회할 수 있다).
  # 결제 — 응원하기(cheer/). 장부는 payment-jdbc 가 있어서 켜지고, 토스는 꺼진 채 시작한다: SKELETON_PAYMENT_TOSS_ENABLED=true + 키 둘. 켜지 않으면 앱은 예전처럼 뜨고 결제 화면은 「지금은 결제할 수 없어요」다
  # (GET /api/v1/payments/config 가 available: false). 값을 바꾸는 환경변수 이름은 docs/sample.md 「결제 — 응원하기」 에 모아 두었다.
  payment:
    # 접속 나라로 결제사 · 해지·환불 규칙을 서버가 정한다(화면은 못 바꾼다): 한국(KR) 은 토스 + 한국 소비자 정책(아래 subscription.cancel), 그 밖은 Paddle + 기간 끝 해지만.
    # 나라는 Cloudflare 가 붙인 CF-IPCountry — skeleton.web.client-ip.mode=cloudflare 일 때만 믿는다(배포가 정한다). 못 정하면 아래 cancel.default-country.
    # 아래 지도에 있는 나라(KR)는 그 결제사만 쓴다 — 토스가 꺼져 있으면 Paddle 로 넘기지 않고 결제를 닫는다(503). 지도에 없는 나라는 default-provider, 그것도 못 쓰면 하나뿐인 결제사. 로컬 개발: SKELETON_PAYMENT_ROUTING_DEV_COUNTRY=US 처럼 한 나라로 고정(보호 환경에서는 기동 실패).
    default-provider: paddle
    routing:
      country-providers:
        KR: toss
      provider-currencies:                   # 이 요청의 통화 = 라우팅이 고른 결제사의 통화: 토스는 KRW 하나뿐이라 적지 않아도 되고, Paddle 은 여러 통화를 받아 USD 로 정한다(카탈로그의 USD 가격)
        paddle: USD
    # 운영자 경로(/api/v1/admin/payments)는 모듈 기본대로 꺼 둔다 — 켜려면 SKELETON_PAYMENT_ADMIN_ENABLED=true (로컬 프로필은 application-local.yml 이 켠다).
    # 켜도 판정은 platform 의 권한 판정(payment.read · payment.refund · payment.operate) — 계정 모듈이 있어 토큰의 역할이 아니라 매 호출 저장소의 역할을 다시 읽는다(회수가 바로 먹는다). 누가 어느 권한을 갖는지는 skeleton.authz.
    reconcile:
      first-delay: 90s                 # 이 앱의 선택(모듈 기본 60초): 네이버페이 승인 · 취소의 응답 제한이 문서의 60초라 그보다 길어야 한다 — 네이버페이를 켰을 때 payment-naverpay 의 가드가 기동 때 본다
    webhook:
      inline:
        enabled: true                  # 웹훅을 받은 요청 안에서 바로 한 번 반영해 본다(짧은 시간 한도, 실패하면 일꾼이 지금처럼) - 결제 직후 화면이 일꾼의 차례를 안 기다린다. 모듈 기본은 꺼짐
      path-token: ${SKELETON_PAYMENT_WEBHOOK_PATH_TOKEN:}   # 값은 커밋하지 않는다 — 환경변수로만(배포 선언의 secrets:). 비면 서명 없는 결제사(토스)의 웹훅 경로는 늘 404 이고, 보호 환경에서는 기동 실패. 24자 이상
    # 구독(자동결제) — 모듈 기본은 꺼짐이고 이 앱도 환경변수로 켠다: SKELETON_PAYMENT_SUBSCRIPTION_ENABLED=true. 켜면 빌링키를 암호화할 키(아래 crypto)와 빌링을 하는 결제사(토스)가 있어야 한다 —
    # 없으면 기동 실패(카드를 받고도 과금할 수 없는 구독이 뜨지 않게). 플랜은 catalog 의 표(씨앗 catalog/CatalogSeed, 운영 화면에서 고친다), 주기는 skeleton.sample.subscription.period · yearly-period. 로컬 프로필은 토스를 켰을 때 함께 켠다(application-local.yml).
    subscription:
      enabled: ${SKELETON_PAYMENT_SUBSCRIPTION_ENABLED:false}
      plan-change:                            # 위 등급으로 바로 바꾸기 — 모듈은 과금 방식을 고르지 않는다. 이 앱의 선택: 남은 기간의 차액만(PRORATED_DIFFERENCE), 100원 미만이면 과금 없이 (전액 결제 후 새 주기는 FULL_RESTART)
        enabled: true
        charge: PRORATED_DIFFERENCE
        min-charge: 100
      cancel:                                 # 해지·환불 정책 - 이 앱의 견본: KR 은 한국 소비자 정책(중도 해지 · 7일 철회 · 위약금 10%), 그 밖은 기간 끝 해지만. 화면의 환불 정책 페이지가 같은 내용이다
        default-country: KR                    # 나라를 못 정했을 때(Cloudflare 앞이 아니다 · 로컬) 쓰는 나라 - 결제사 · 해지 정책 모두 이 나라로 정해진다
        policies:
          KR: korea
        korea:
          penalty-percent: 10
          withdrawal-days: 7
  crypto:
    primary-key-id: ${SKELETON_CRYPTO_PRIMARY_KEY_ID:main}
    keys:
      main: ${SKELETON_CRYPTO_KEYS_MAIN:}   # base64 로 인코딩한 32바이트 AES 키 — 비밀이라 커밋하지 않는다(배포는 선언의 secrets:). 구독을 켰는데 비면 기동 실패
  sample:
    subscription:
      period: ${SKELETON_SAMPLE_SUBSCRIPTION_PERIOD:P1M}   # 견본 월 가격의 갱신 주기(ISO-8601). 로컬 프로필은 PT3M
      yearly-period: ${SKELETON_SAMPLE_SUBSCRIPTION_YEARLY_PERIOD:P1Y}   # 견본 연 가격의 갱신 주기. 로컬 프로필은 PT36M. 가격은 만든 뒤 못 고치니 씨앗이 이미 뿌려진 DB 에는 새 값이 먹지 않는다
  payment-toss:
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}                # 벤더 표준 이름 별칭 (모듈의 이름은 SKELETON_PAYMENT_TOSS_SECRET_KEY — 둘 다 먹고, 모듈 이름이 이긴다). 비밀 — 커밋하지 않는다
    easy-pays: [NAVERPAY, KAKAOPAY, TOSSPAY]                # 결제창의 카드 단추 옆에 간편결제 단추(상점 계약에 있는 것만 열린다). 스켈레톤 기본은 빈 목록
    client-key: ${TOSS_PAYMENTS_CLIENT_KEY:}                # 같은 묶음의 test_ck_… (비밀 아님). 서버가 결제창 값(GET …/orders 의 checkout)으로 프론트에 준다
  payment-kakaopay:                                         # 카카오페이 직접 연동(토스 계약 없이). 켜기: SKELETON_PAYMENT_KAKAOPAY_ENABLED=true. 시크릿 키 · 가맹점 코드가 모두 있어야 서고, 비면 이 결제사만 없다(보호 환경은 기동 실패)
    secret-key: ${SKELETON_PAYMENT_KAKAOPAY_SECRET_KEY:}    # 개발자센터 앱의 Secret key(dev) — 비밀, 커밋하지 않는다
    cid: ${SKELETON_PAYMENT_KAKAOPAY_CID:}                  # 가맹점 코드 — 테스트는 TC0ONETIME (비밀 아님)
    return-url: ${SKELETON_PAYMENT_KAKAOPAY_RETURN_URL:}    # 구매자를 돌려보낼 이 앱의 화면 주소 — <프런트 주소>/payments/return (비밀 아님)
    allowed-return-origins: ${SKELETON_PAYMENT_KAKAOPAY_ALLOWED_RETURN_ORIGINS:}   # 쉼표로 이은 origin — 결제를 시작한 화면의 origin 으로 돌아오게 허락(예: http://localhost:5173). 비면 늘 return-url
  payment-naverpay:                                         # 네이버페이 직접 연동(토스 계약 없이). 켜기: SKELETON_PAYMENT_NAVERPAY_ENABLED=true. 클라이언트 아이디 · 시크릿 · 체인 아이디가 모두 있어야 서고, 비면 이 결제사만 없다(보호 환경은 기동 실패)
    mode: ${SKELETON_PAYMENT_NAVERPAY_MODE:development}      # development | production — API 서버 · 결제창 도메인이 함께 따른다. 개발 모드로 stage|prod, 운영 모드로 로컬에 서면 기동 실패
    client-id: ${SKELETON_PAYMENT_NAVERPAY_CLIENT_ID:}       # 가맹점 식별키 — 서버가 헤더로 싣는다(비밀 아님)
    client-secret: ${SKELETON_PAYMENT_NAVERPAY_CLIENT_SECRET:}   # 비밀, 커밋하지 않는다
    chain-id: ${SKELETON_PAYMENT_NAVERPAY_CHAIN_ID:}         # 가맹점 그룹 식별키(비밀 아님). 단건 값을 쓴다
    return-url: ${SKELETON_PAYMENT_NAVERPAY_RETURN_URL:}     # 구매자를 돌려보낼 이 앱의 화면 주소 — <프런트 주소>/payments/return (비밀 아님)
    allowed-return-origins: ${SKELETON_PAYMENT_NAVERPAY_ALLOWED_RETURN_ORIGINS:}   # 쉼표로 이은 origin — 뜻은 위 카카오페이와 같다. 비면 늘 return-url
    base-url: ${SKELETON_PAYMENT_NAVERPAY_BASE_URL:}         # 비우면 모드가 정한 네이버페이 주소 — 프런트 e2e 는 가짜 네이버페이를 가리킨다
    window-base-url: ${SKELETON_PAYMENT_NAVERPAY_WINDOW_BASE_URL:}   # 비우면 모드가 정한 결제창 주소(test-m.pay.naver.com / m.pay.naver.com) — 프런트 e2e 의 가짜 결제창
  payment-paddle:                                           # 해외 결제(판매 대행). 켜기: SKELETON_PAYMENT_PADDLE_ENABLED=true. 세 비밀이 모두 있어야 서고, 하나라도 비면 이 결제사만 없다(서버는 뜬다)
    api-key: ${PADDLE_API_KEY:}                             # 비밀 — 커밋하지 않는다
    client-token: ${PADDLE_CLIENT_TOKEN:}                   # Paddle.js 클라이언트 토큰 (비밀 아님)
    webhook-secret: ${PADDLE_WEBHOOK_SECRET:}               # 웹훅 엔드포인트 비밀값 — 비밀
    environment: ${PADDLE_ENVIRONMENT:sandbox}              # sandbox | live
    base-url: ${PADDLE_BASE_URL:}                           # 비우면 환경의 기본 주소. e2e 의 가짜 Paddle 만 적는다
    signature-tolerance: ${PADDLE_SIGNATURE_TOLERANCE:60s}
    prices:                                                 # 가격 코드 · 응원 상품 코드 → Paddle 가격 id (금액 · 통화는 Paddle 가격이 정한다). 카탈로그의 USD 가격 줄에 운영 화면에서 붙인 링크가 있으면 그쪽이 이긴다
      basic-usd: ${PADDLE_PRICE_BASIC:}
      standard-usd: ${PADDLE_PRICE_STANDARD:}
      pro-usd: ${PADDLE_PRICE_PRO:}
      basic-yearly-usd: ${PADDLE_PRICE_BASIC_YEARLY:}
      standard-yearly-usd: ${PADDLE_PRICE_STANDARD_YEARLY:}
      pro-yearly-usd: ${PADDLE_PRICE_PRO_YEARLY:}
      cheer-1000: ${PADDLE_PRICE_CHEER_1000:}
      cheer-3000: ${PADDLE_PRICE_CHEER_3000:}
      cheer-5000: ${PADDLE_PRICE_CHEER_5000:}
  http:
    clients:
      payment-toss:
        response-timeout: 30s   # 이 앱의 선택(플랫폼 기본 5초): 승인 · 환불은 토스가 느릴 수 있다. reconcile.first-delay(60s) · refund.settle-delay(2m)가 이보다 길어야 한다 — 토스를 켜면 payment-toss 의 가드가 기동 때 본다
      payment-naverpay:
        response-timeout: 60s   # 문서가 승인 · 취소에 권하는 시간(최종 승인이 끝나기까지 시간이 걸린다). reconcile.first-delay(90s) · refund.settle-delay(2m)가 이보다 길어야 한다 — 네이버페이를 켜면 payment-naverpay 의 가드가 기동 때 본다
  authz:
    admin:
      enabled: true   # 이 앱의 선택: 역할 관리 API(/api/v1/admin/roles) 를 켠다 — 스켈레톤 기본은 꺼짐(404)
  notification:
    retention:
      enabled: true   # 이 앱의 선택: 보관 기한(기본 90일)이 지난 알림을 지운다 (모듈 기본은 꺼짐 - 보관 정책은 앱이 정한다). scheduler 모듈이 주기를 돈다
    preferences:
      types: [NOTE_UPDATED, comment.created, comment.replied, reward.granted]   # 이 앱의 선택: 설정 화면에서 끌 수 있는 알림 종류 (이 밖의 알림은 끌 수 없다)
    sse:
      heartbeat: 15s  # 이 앱의 선택: 연결이 조용해도 프록시가 끊지 않게 15초마다 주석 한 줄 (짝 웹 클라이언트 idleTimeoutMs 는 45초)
  # 이벤트 · 보상 - 운영 경로는 모듈 기본대로 꺼져 있고 이 앱이 켠다(권한 campaign.manage · coupon.manage · point.manage · reward.operate 는 기본 역할 없이 ADMIN 전권만 - 역할 관리에서 나눠 준다)
  campaign:
    admin:
      enabled: true
    zone: Asia/Seoul   # 이 앱의 선택: 「오늘」 출석의 날짜 경계 (비우면 skeleton.time.default-zone)
  catalog:
    default-locale: ko   # 이 앱의 선택: 결제창 · 플랜 이름은 한국어 이름 (모듈 기본 en)
    http:
      enabled: true      # 이 앱의 선택: 로그인 없이 읽는 가격표(랜딩) - 스켈레톤 기본은 꺼짐(404)
    admin:
      enabled: true      # 이 앱의 선택: 운영 화면(상품 · 가격)이 쓰는 경로 - 권한 catalog.manage 는 기본 역할 없이 ADMIN 전권만
  coupon:
    admin:
      enabled: true
    dashboard:
      enabled: true   # 이 앱의 선택: 대시보드에 쿠폰 사용 수 타일과 많이 쓰인 쿠폰 순위 (스켈레톤 기본은 꺼짐)
  point:
    admin:
      enabled: true
  reward:
    admin:
      enabled: true
  dashboard:
    admin:
      enabled: true   # 이 앱의 선택: 관리자 대시보드 API(/api/v1/admin/dashboard) 를 켠다 — 스켈레톤 기본은 꺼짐(404). 보려면 권한 dashboard.read (ADMIN 은 늘 가진다)
    zone: Asia/Seoul  # 이 앱의 선택: 「오늘」 · 일별 경계의 시간대
    currency: KRW     # 이 앱의 선택: 순매출 타일이 먼저 보여 줄 통화
  dashboard-cloudflare:
    # 이 앱의 선택: 방문 · 유입 카드를 Cloudflare Web Analytics 로 채운다. 값은 커밋하지 않는다 — 환경변수로만(SKELETON_DASHBOARD_CLOUDFLARE_{ACCOUNT_ID,SITE_TAG,API_TOKEN}, 토큰은 배포 선언의 secrets:).
    # 비워 두면 앱은 그대로 뜨고 Cloudflare 카드만 「연결하면 보입니다」 — 우리 DB 숫자(가입 · 활성 · 매출 · 결제)는 키 없이 나온다.
    account-id: ""
    site-tag: ""
    api-token: ""
  dashboard-ga:
    # 이 앱의 선택: 유입 · 흐름 카드와 「지금 N명」 을 GA4 로 채운다. 값은 커밋하지 않는다 — 환경변수로만(SKELETON_DASHBOARD_GA_{PROPERTY_ID,CREDENTIALS,KEY_EVENT}, 키는 배포 선언의 secrets:).
    # 비워 두면 앱은 그대로 뜨고 GA 카드만 「연결하면 보입니다」.
    property-id: ""
    credentials: ""
    key-event: ""
