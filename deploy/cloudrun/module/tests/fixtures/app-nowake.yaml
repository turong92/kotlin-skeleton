# app.yaml 에서 cloudrun.wake 만 뺀 선언.
name: acme
port: 8080
health: /health
env_prefix: ACME
domain: acme.example.com
api_prefix: /api/v1
db: none
redis: false
secrets:
  - JWT_SECRET
env:
  ACME_ENV: prod
cloudrun:
  dockerfile: Dockerfile.native
  build_args: { APP: api }
  cpu: 1
  memory: 512Mi
  min_instances: 0
  max_instances: 1
  concurrency: 20
  timeout: 300s
